function toggleAllGroups(){
  /* 全部展开 = 所有分组都不带 CLOSED 标记。判断「现在是不是全开着」必须
     对着当前分组名看 —— 一开始 CLOSED 是空对象，只看它自己的 key 会误判成
     「没有开着的」，第一次点击就变成空操作。 */
  const anyOpen = GNAMES.some(n => CLOSED[n] !== true);

function practiceSetHref(p){

function problemSidebarHtml(subject, currentId){

  let h = '<aside class="pcard pside" id="problemSidebar" aria-label="当前科目题目导航">'
    + '<div class="psideHead"><span class="psideTitle">题目导航</span>'
    + '<button class="psideToggle" type="button" onclick="toggleProblemSidebar()" aria-label="折叠或展开题目导航" title="折叠或展开题目导航">' + arrow + '</button></div>'
    + '<div class="psideBody" id="psideBody">';
  groups.forEach((list, name) => {
    const solved = list.filter(solvedOf).length;
    h += '<details class="psideGroup"' + (list.some(x => x.id === currentId) ? ' open' : '') + '><summary class="psideGroupHead">' + esc(name)
      + '<span>' + solved + ' / ' + list.length + ' 已解决</span></summary><div class="psideTiles">';
    list.forEach(x => {

      const mark = { solved:'✓', partial:'◐', att:'•', none:'' }[status];
      h += '<a class="psideTile ' + status + (x.id === currentId ? ' active' : '')
        + '" href="#/p/' + x.id + '" title="' + escAttr(SUBJ_SEQ[x.id] || x.id) + ' ' + escAttr(x.title) + ' · ' + label + '"'

        + (x.id === currentId ? ' aria-current="page"' : '') + '>' + esc(SUBJ_SEQ[x.id] || x.id)
        + (mark ? '<span class="tileMark" aria-hidden="true">' + mark + '</span>' : '') + '</a>';

function sidebarIsCollapsed(){
  try { return localStorage.getItem(LS.problemSidebar) === '1'; } catch(e){ return false; }
}
function toggleProblemSidebar(){
  const grid = document.getElementById('problemGrid');
  if (!grid) return;
  const collapsed = grid.classList.toggle('sidebarCollapsed');
  try { localStorage.setItem(LS.problemSidebar, collapsed ? '1' : '0'); } catch(e){}
  const toggle = grid.querySelector('.psideToggle');
  if (toggle) toggle.textContent = collapsed ? '⇥' : '⇤';
  updateProblemColumns();

function storedProblemRatio(){
  try {
    const value = Number(localStorage.getItem(LS.problemSplit));
    return value > 0 && value < 1 ? value : .5;
  } catch(e){ return .5; }
}
function updateProblemColumns(ratio){
  const grid = document.getElementById('problemGrid');
  if (!grid || window.innerWidth <= 1080) return;
  const sidebar = document.getElementById('problemSidebar');
  const available = grid.clientWidth - sidebar.getBoundingClientRect().width - 10 - 36;
  if (available < 680) return;
  const fraction = ratio === undefined ? storedProblemRatio() : ratio;
  const width = Math.max(340, Math.min(available - 340, Math.round(available * fraction)));
  grid.style.setProperty('--statement-width', width + 'px');
  const divider = document.getElementById('problemDivider');
  if (divider) divider.setAttribute('aria-valuenow', String(Math.round(width / available * 100)));
}
function initProblemLayout(){
  const grid = document.getElementById('problemGrid');
  const divider = document.getElementById('problemDivider');
  if (!grid || !divider) return;
  updateProblemColumns();
  const active = document.querySelector('.psideTile.active');
  const body = document.getElementById('psideBody');
  if (active && body) body.scrollTop = Math.max(0, active.offsetTop - body.offsetTop - body.clientHeight / 3);
  divider.addEventListener('pointerdown', e => {
    if (window.innerWidth <= 1080) return;
    e.preventDefault();
    divider.setPointerCapture(e.pointerId);
    divider.classList.add('dragging');
    const startX = e.clientX;
    const startWidth = grid.querySelector('.pstmt').getBoundingClientRect().width;
    const available = grid.clientWidth - document.getElementById('problemSidebar').getBoundingClientRect().width - 10 - 36;
    const move = ev => updateProblemColumns((startWidth + ev.clientX - startX) / available);
    const stop = () => {
      divider.classList.remove('dragging');
      divider.removeEventListener('pointermove', move);
      divider.removeEventListener('pointerup', stop);
      divider.removeEventListener('pointercancel', stop);
      const width = grid.querySelector('.pstmt').getBoundingClientRect().width;
      try { localStorage.setItem(LS.problemSplit, String(width / available)); } catch(e){}
    };
    divider.addEventListener('pointermove', move);
    divider.addEventListener('pointerup', stop);
    divider.addEventListener('pointercancel', stop);
  });
  divider.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const available = grid.clientWidth - document.getElementById('problemSidebar').getBoundingClientRect().width - 10 - 36;
    const width = grid.querySelector('.pstmt').getBoundingClientRect().width + (e.key === 'ArrowRight' ? 24 : -24);
    updateProblemColumns(width / available);
    try { localStorage.setItem(LS.problemSplit, String(grid.querySelector('.pstmt').getBoundingClientRect().width / available)); } catch(error){}
  });
}

function draftOf(k){
  try {
    const v = localStorage.getItem(k);
    if (v) return v;
    /* ★★ 历史遗留下来的坑：早期版本把 `LS.draft + id` 直接当 key 用了，
       可 `LS.draft` 是个**函数**，参与字符串拼接时会被转成源码文本，
       于是那些草稿的真实 key 长这样：`p => 'pta.draft.' + p1`。
       读写两边用的是同一个错 key，所以自己用着没感觉；
       但「导出进度」是按 `pta.draft.` **前缀**去捞草稿的 → 一份都捞不到。
       现在统一成 `pta.draft.<id>`，旧的在这里顺手搬过来，别让人丢草稿。 */
    const legacy = String(LS.draft) + k.slice('pta.draft.'.length);
    const old = localStorage.getItem(legacy);
    if (old){ localStorage.setItem(k, old); localStorage.removeItem(legacy); return old; }
    return '';
  } catch(e){ return ''; }
}

/* 从界面取「理论题」的答案（判断题 / 单选题 / 填空题）。
   ★ 判断题的答案就是「对 / 错」这两个字，直接交正文；
     单选题题库里存的是选项**字母**，所以交字母（交正文也判得过，
     后端 backfill_choice_alts 会把正文补成备选答案）。
   返回 null 表示不合格 —— 提示已经弹过了，调用方直接 return。 */
function readTheoryAnswer(){
  const p = CUR;
  if (p.is_choice){
    const selected = Array.from(document.querySelectorAll('.choice.on'));
    if (!selected.length){ toast('先选一个选项', 'err'); return null; }
    const ch = p.choices || [];
    const kind = questionTypeKey(p);
    if (kind === 'true_false') return selected[0].getAttribute('data-v');
    const letters = selected.map(on => String.fromCharCode(65 + parseInt(on.getAttribute('data-i'), 10))).sort().join('');
    return kind === 'multiple_choice' ? letters : letters.slice(0, 1);
  }
  const box = document.getElementById('codeBox');
  const v = box ? box.value : '';
  if (!v.trim()){ toast('答案不能为空', 'err'); return null; }
  return v;
}

async function doSubmit(){
  const btn = document.getElementById('btnSubmit');
  const p = CUR;
  const theory = p.line === 'text';
  let code, lang = 'python', interp = 'py313';

  if (p.is_choice || theory){
    lang = 'text';
    interp = 'text';
    code = readTheoryAnswer();
    if (code === null) return;
  } else {
    code = codeValue();
    if (!code.trim()){ toast('代码不能为空', 'err'); return; }
    const ls = document.getElementById('langSel');
    if (ls) lang = ls.value;
    const isel = document.getElementById('interpSel');
    if (isel) interp = isel.value;
    else if (lang === 'c') interp = 'gcc';
    else if (lang === 'cpp') interp = 'gpp';
  }

  if (btn) { btn.disabled = true; btn.textContent = '提交中…'; }
  const rb = document.getElementById('resultBox');
  rb.innerHTML = verdictHtml('pending', '正在提交…', '');
  try {
    const r = await api('/api/submissions', { method:'POST',
      body: { problem_id: p.id, code: code, lang: lang, interpreter: interp } });
    pollSubmission(r.id);
  } catch(e){
    if (String(e.message) === 'NO_BACKEND'){ OFFLINE = true; renderButtons(); }
    rb.innerHTML = verdictHtml('IE', '提交失败', String(e.message || e));
    if (btn){ btn.disabled = false; btn.textContent = '提交评测'; }

}

/* 离线本地判题（理论题专用）。判题逻辑全在 judge_text.js 里 ——
   它与后端 app/judge 逐条对拍过，这里只负责「取答案 → 判 → 展示 → 记进度」。
   ★ 返回的结构与后端提交结果**字段完全一致**，所以能直接复用 renderResult。 */
function doSubmitLocal(){
  const p = CUR;
  if (!(window.TextJudge && TextJudge.canJudgeLocally(p))){
    toast('这道题在本地判不了：题库里没带它的测试点', 'err');
    return;
  }
  const answer = readTheoryAnswer();
  if (answer === null) return;

  const btn = document.getElementById('btnSubmit');
  const r = TextJudge.judgeTextProblem(p, answer);
  if (r.error){ toast(r.error, 'err'); return; }

  saveLocalSubmission(p, r, answer, 'text');
  RESULT = r;
  renderResult(r);
  setLocalProgress(p.id, r.score, r.max_score || p.total_score || 0);
  if (btn) btn.textContent = '再交一次';
  afterJudgeRefresh();
}

/* 浏览器判题的引擎（Python 约 13 MB / C++ 编译器约 29 MB）都是从本站下载的，
   下载中途被掐是最常见的失败 —— 失败后直接重试就会重新下载，把这条出路告诉用户。 */
function localJudgeHint(e){
  const msg = String(e && e.message || e);
  if (/network error|Failed to (decompress|load)|超时|加载失败/.test(msg))
    return msg + '\n\n提示：判题引擎是从本站下载的，刚才下载中断了。'
      + '检查网络后**再点一次「提交并判题」**就会重新下载，不用刷新页面；github.io 偶尔不稳，多试一两次通常能成功。';
  return msg;
}

function verdictHtml(v, title, detail){
  const cls = v === 'AC' ? 'v-AC' : (v === 'pending' || v === 'judging' ? 'v-pending' : 'v-' + v);
  const spin = (v === 'pending' || v === 'judging') ? '<span class="spin"></span>' : '';
  return '<div class="verdict ' + cls + '">' + spin + '<span>' + esc(title || VERDICT_TXT[v] || v) + '</span></div>'
    + (detail ? '<div class="hintline" style="margin-top:8px;white-space:pre-wrap">' + esc(detail) + '</div>' : '');
}

function pollSubmission(sid){
  const version = routeVersion, pid = CUR.id;
  if (POLL) clearInterval(POLL);
  let tries = 0;
  const tick = async () => {
    if (version !== routeVersion || SET.view !== 'p' || !CUR || CUR.id !== pid) return;
    tries++;
    if (tries > 90){ POLL = null; renderButtons(); toast('评测超时，请到「我的提交」查看', 'err'); return; }
    let s;
    try { s = await api('/api/submissions/' + sid + '?with_cases=1'); }
    catch(e){
      if (version === routeVersion && SET.view === 'p' && CUR && CUR.id === pid) {
        POLL = null; renderButtons();
        document.getElementById('resultBox').innerHTML = verdictHtml('IE', '暂时无法获取评测结果', '请到「我的提交」查看，或稍后重试。');
      }
      return;
    }
    if (version !== routeVersion || SET.view !== 'p' || !CUR || CUR.id !== pid) return;
    const v = s.verdict;
    if (v !== 'pending' && v !== 'judging'){ POLL = null; RESULT = s; renderResult(s); afterJudgeRefresh(); return; }
    const rb = document.getElementById('resultBox');
    if (rb) rb.innerHTML = verdictHtml(v, '正在评测…（第 ' + s.passed + '/' + s.total + ' 个测试点）', '');
    POLL = setTimeout(tick, 700);
  };
  tick();
}

async function afterJudgeRefresh(){
  await refreshAll();
  /* 同步当前题目里的进度指针 */
  if (CUR){
    const fresh = PROBLEMS.find(x => x.id === CUR.id);
    if (fresh) CUR.best_score = fresh.best_score, CUR.solved = fresh.solved;
  }
  refreshProblemSidebar();
  const chip = document.getElementById('problemStatusChip');
  if (chip && CUR) chip.innerHTML = solvedOf(CUR) ? '<span class="pill p-ok">已解决</span>'
    : (bestOf(CUR) > 0 ? '<span class="pill p-warn">部分正确 ' + bestOf(CUR) + ' 分</span>' : '');
  if (SET.view === 'set') viewSet(SET.subject);
}

function renderResult(s){
  const box = document.getElementById('resultBox');
  const max = parseInt(s.max_score || 0, 10);
  const got = parseInt(s.score || 0, 10);
  let title = VERDICT_TXT[s.verdict] || s.verdict;
  let cls = s.verdict === 'AC' ? 'v-AC' : 'v-' + s.verdict;
  if (got > 0 && got < max) { title = '部分正确'; cls = 'v-partial'; }
  else if (s.verdict === 'AC' && got < max) { title = '答案正确'; }

  let h = '<div class="verdict ' + cls + '"><span>' + esc(title) + '</span>'
        + '<span style="margin-left:auto;font-size:14px">' + got + ' / ' + max + ' 分</span></div>';

  const theory = CUR && CUR.line === 'text';
  if (theory) {
    h += '<div class="resultLearning"><b>' + (s.verdict === 'AC' ? '答对了，可以继续练习或查看本讲笔记。' : '再检查选项中的概念区别，也可以查看本讲笔记。') + '</b>' + noteChipFor(CUR) + '</div>';
    h += '<details class="resultDetails"><summary>查看评测明细与参考答案</summary>';
  }
  h += '<div class="resMeta">'
    + '<span>通过测试点 <b>' + (s.passed||0) + ' / ' + (s.total||0) + '</b></span>'
    + (s.time_ms ? '<span>耗时 <b>' + s.time_ms + ' ms</b></span>' : '')
    + (s.mem_kb ? '<span>内存 <b>' + (s.mem_kb/1024).toFixed(1) + ' MB</b></span>' : '')
    + (s.lang ? '<span>语言 <b>' + esc(String(s.lang).toUpperCase()) + '</b></span>' : '')
    + '</div>';

  if (s.message) h += '<div class="hintline" style="white-space:pre-wrap;margin-top:8px">' + esc(s.message) + '</div>';
  if (s.compile_output) h += '<div class="hintline" style="margin-top:8px">编译器输出：</div>'
    + '<pre class="ioRow" style="background:var(--panel2);border:1px solid var(--border2);border-radius:7px;padding:9px 11px;overflow:auto;font-size:12.3px">'
    + esc(s.compile_output) + '</pre>';

  const cases = s.cases || [];
  if (cases.length){
    h += cases.map((c, i) => {
      const ok = c.verdict === 'AC' || c.verdict === 'OK';
      return '<div class="caseRow">'
        + '<div class="caseHead" onclick="toggleCase(this)">'
        +   '<span class="dot d-' + esc(c.verdict) + '"></span>'
        +   '<span class="nm">测试点 ' + (i+1) + '</span>'
        +   '<span class="pill' + (ok ? ' p-ok' : '') + '" style="font-size:11px">' + (VERDICT_TXT[c.verdict] || c.verdict) + '</span>'
        +   '<span class="grow"></span>'
        +   '<span class="pts">' + (c.earned||0) + ' / ' + (c.points||0) + ' 分</span>'
        +   '<span class="ms">' + (c.time_ms||0) + ' ms</span>'
        + '</div>'
        + '<div class="caseBody" style="display:none">'
        +   ioRow('输入', c.stdin)
        +   ioRow('期望输出', c.expected)
        +   ioRow('你的输出', c.stdout, ok ? '' : 'err')
        +   (c.stderr ? ioRow('标准错误', c.stderr, 'err') : '')
        +   (c.detail ? '<div class="hintline">' + esc(c.detail) + '</div>' : '')
        + '</div></div>';
    }).join('');
  }
  if (theory) h += '</details>';
  const seq = problemSequence(CUR.subject || 'python'), index = seq.findIndex(p => p.id === CUR.id), next = seq[index + 1];
  h += '<div class="btnrow resultActions">'
    + (next ? '<a class="btn" href="#/p/' + next.id + '">下一题 →</a>' : '<a class="btn" href="#/set/' + esc(CUR.subject || 'python') + '">返回题集</a>')
    + '<button class="btn ghost" onclick="openResultNote()">记录错因</button></div>';
  box.innerHTML = h;
}

function ioRow(label, val, cls){
  return '<div class="ioRow"><div class="lb">' + label + '</div><pre'
    + (cls ? ' class="' + cls + '"' : '') + '>' + (val === null || val === undefined || val === '' ? '（空）' : esc(val)) + '</pre></div>';

function toggleCase(head){

async function doRun(){
  const stdinEl = document.getElementById('stdinBox');
  const code = codeValue();
  if (!code.trim()){ toast('代码不能为空', 'err'); return; }
  const ls = document.getElementById('langSel');
  const isel = document.getElementById('interpSel');
  const lang = ls ? ls.value : 'python';
  const interp = isel ? isel.value : (lang === 'c' ? 'gcc' : (lang === 'cpp' ? 'gpp' : 'py313'));
  const rb = document.getElementById('resultBox');
  rb.innerHTML = verdictHtml('pending', '正在运行…', '');
  try {
    const r = await api('/api/run', { method:'POST', body: {
      code: code, lang: lang, interpreter: interp,
      stdin: stdinEl ? stdinEl.value : '', time_limit_ms: 5000, memory_limit_mb: 256 } });
    let h = verdictHtml(r.ok ? 'OK' : (r.verdict || 'RE'),
      r.ok ? '运行成功' : (r.verdict === 'CE' ? '编译错误' : VERDICT_TXT[r.verdict] || r.verdict), '');
    h += '<div class="resMeta"><span>耗时 <b>' + (r.time_ms||0) + ' ms</b></span>'
       + '<span>内存 <b>' + ((r.mem_kb||0)/1024).toFixed(1) + ' MB</b></span></div>';
    if (r.compile_output) h += ioRow('编译器输出', r.compile_output, 'err');
    h += ioRow('标准输出', r.stdout);
    if (r.stderr) h += ioRow('标准错误', r.stderr, 'err');
    if (r.detail) h += '<div class="hintline" style="margin-top:8px">' + esc(r.detail) + '</div>';
    rb.innerHTML = h;
  } catch(e){
    rb.innerHTML = verdictHtml('IE', '运行失败', String(e.message || e));
  }
}

/* =========================================================================
   10.4 视图五：错题本 / 收藏（#/wrongbook）

   为什么单独一个视图
   ------------------
   判题只管「对/错」，但复习要的是「我为什么错、下次注意什么」。
   这一页把三样东西摆在一起：**错题**（做过但没满分，算出来的）、
   **收藏**（手动星的）、**备注**（自己写的一句话错因）。
   它的核心不是列表，而是那个**能改的备注框** —— 巩固靠的是自己写的那句话。

   ★ 数据来源两条腿：
     - 在线：`GET /api/wrongbook`（服务端归集，跨设备一致）
     - 离线：题库 + localStorage 里的进度/标注现算（静态站照样能用）
     两条腿出来的 items 形状完全一样，后面的筛选/编辑不用分叉。

   ★ 本地标注永远覆盖服务端值：写操作先落本地（见 saveMastery 的注释），
     服务端那趟还在路上时，界面不能先把你刚写的字抹掉。
   ========================================================================= */
/* ★ 默认是「全部」，不是「待攻克」。
   教训（线上 Pages 实测踩到）：点个星标收藏一道**还没做过**的题，它的 attempts 是 0，
   按 `is_wrong = attempts>0 && best_score<total` 压根不算错题 —— 于是统计卡明明写着
   「已收藏 1」，列表里却是空的，看着像收藏没生效。默认给并集就没这个坑。 */
const WB_FILTERS = [
  { k:'all',     t:'全部' },
  { k:'wrong',   t:'待攻克' },
  { k:'starred', t:'收藏' },
  { k:'noted',   t:'有备注' },
  { k:'solved',  t:'已满分' },
];
let WB_FILTER = 'all';
let WB_SUBJECT = 'all';
let WB_Q = '';
const WB_SUBJ_ORDER = ['python', 'ds', 'linux'];
const WB_SUBJ_SHORT = { python:'Python', ds:'数据结构', linux:'Linux' };

function wbState(key, val){
  if (key === 'filter') WB_FILTER = val;
  else if (key === 'subject') WB_SUBJECT = val;
  else if (key === 'q') WB_Q = val;
  try { localStorage.setItem(LS.wbFilter, WB_FILTER); } catch(e){}
  try { localStorage.setItem(LS.wbSubject, WB_SUBJECT); } catch(e){}
}

/* 归集：在线走接口，离线现算，最后统一叠上本地标注 */
async function wrongbookData(){
  let items = [], served = false;
  if (!OFFLINE){
    try { const r = await api('/api/wrongbook'); items = r.items || []; served = true; } catch(e){}
  }
  if (!served){
    const lp = localProgress();
    items = (PROBLEMS || []).map(p => {
      const g = lp[p.id] || {};
      const best = parseInt(g.best_score || 0, 10) || 0;
      const tot = parseInt(p.total_score || 0, 10) || 0;
      const att = parseInt(g.attempts || 0, 10) || 0;
      return {
        id: p.id, title: p.title, subject: p.subject || 'python', line: p.line,
        question_type: p.question_type || '', total_score: tot, best_score: best,
        attempts: att, last_verdict: '', is_starred: isStarred(p) ? 1 : 0,
        level: levelOf(p.id), note: noteOf(p.id), source_section: p.source_section || '',
        solved_at: g.solved_at || '', is_wrong: att > 0 && best < tot,
        solved: !!g.solved_at,
      };
    }).filter(it => it.attempts > 0 || it.is_starred || it.note || it.level > 0);
  }
  /* 本地标注覆盖服务端（判据同上：本地是「刚刚发生的事」） */
  return items.map(it => {
    const m = masteryOf(it.id);
    const x = Object.assign({}, it);
    if ('is_starred' in m) x.is_starred = m.is_starred ? 1 : 0;
    if ('level' in m) x.level = parseInt(m.level, 10) || 0;
    if ('note' in m) x.note = m.note || '';
    x.is_wrong = !!x.is_wrong;
    return x;
  });
}

function wbMatch(it, f, subj, q){
  if (subj !== 'all' && (it.subject || 'python') !== subj) return false;
  if (f === 'wrong'   && !it.is_wrong) return false;
  if (f === 'starred' && !it.is_starred) return false;
  if (f === 'noted'   && !it.note) return false;
  if (f === 'solved'  && !it.solved) return false;
  if (q){
    const hay = (it.title + ' ' + (it.note || '') + ' ' + (it.source_section || '')).toLowerCase();
    if (hay.indexOf(q.toLowerCase()) < 0) return false;
  }
  return true;
}

/* 题目详情页底部的「我的备注」。与错题本里那个框共用 .wbNote / .wbEditor，
   所以事件委托只需一份（wbBind 里认 [data-pnotebox]）。 */

    + '<div class="wbNote' + (note ? '' : ' empty') + '" data-act="edit">'
      + (note ? esc(note) : '＋ 写一句错因 / 下次注意什么') + '</div>'
    + '<div class="wbEditor" hidden>'
      + '<textarea maxlength="' + NOTE_MAX + '"'
        + ' placeholder="例：边界忘了判 n=0；下次先写特殊值再动循环"></textarea>'

        + '<button type="button" class="sm del" data-act="delnote">删除</button>'

}

function wbRow(it){

  const lvl = parseInt(it.level, 10) || 0;
  const vd = String(it.last_verdict || '');
  const vCls = vd === 'AC' ? 'v-AC' : (vd ? 'v-bad' : '');

      + '<div class="wbTitle"><a href="#/p/' + it.id + '">' + esc(it.title) + '</a>'

        + (it.attempts ? '<span>做过 ' + it.attempts + ' 次</span>' : '')

      + '</div>'
      + '<div class="wbNote' + (it.note ? '' : ' empty') + '" data-act="edit"'
        + ' title="点一下就能改">' + (it.note ? esc(it.note) : '＋ 写一句错因 / 下次注意什么') + '</div>'
      + '<div class="wbEditor" hidden>'
        + '<textarea maxlength="' + NOTE_MAX + '" placeholder="例：边界忘了判 n=0；下次先写特殊值再动循环"></textarea>'
        + '<div class="wbEditorRow">'
          + '<button type="button" class="sm pri" data-act="save">保存</button>'
          + '<button type="button" class="sm" data-act="cancel">取消</button>'
          + '<button type="button" class="sm del" data-act="delnote">删除备注</button>'
          + '<span class="sp"></span><span class="cnt">0 / ' + NOTE_MAX + '</span>'
        + '</div>'
      + '</div>'
    + '</div>'
    + '<div class="wbOps">'
      + '<span class="hintline">自评掌握度</span><div class="wbLvl" data-act="lvl" title="自评掌握度，与答题成绩独立">'
        + [0,1,2].map(n => '<button type="button" data-l="' + n + '" class="'
            + (lvl === n ? 'on' : '') + '">' + LEVEL_TXT[n] + '</button>').join('')
      + '</div>'

    + '</div>'
    + '</div>';
}

async function viewWrongbook(opts){
  const version = routeVersion;
  const app = document.getElementById('app');
  const keep = !!(opts && opts.keepScroll);
  if (!keep) app.innerHTML = '<div class="loading">正在整理错题本…</div>';
  const y = window.scrollY;

  const all = await wrongbookData();
  if (version !== routeVersion || SET.view !== 'wrongbook') return;
  const cnt = {
    wrong: all.filter(x => x.is_wrong).length,
    starred: all.filter(x => x.is_starred).length,
    noted: all.filter(x => x.note).length,
    solved: all.filter(x => x.solved).length,
  };
  const shown = all.filter(it => wbMatch(it, WB_FILTER, WB_SUBJECT, WB_Q));

  const statCard = (k, n, lb, cls) =>
    '<div class="wbStat' + (WB_FILTER === k ? ' on' : '') + '" data-act="filter" data-k="' + k + '">'
    + '<div class="n ' + cls + '">' + n + '</div><div class="lb">' + lb + '</div></div>';

  let html = '<div class="wbHero"><div><div class="ttl">错题本</div>'
    + '<div class="sub">收藏随时打星 · 点备注框就能改 · 写完的错因会跟着题目走</div></div></div>';

  html += '<div class="wbStats">'
    + statCard('wrong',   cnt.wrong,   '待攻克', 'bad')
    + statCard('starred', cnt.starred, '已收藏', 'star')
    + statCard('noted',   cnt.noted,   '写了备注', 'warn')
    + statCard('solved',  cnt.solved,  '已满分', 'ok')
    + '</div>';

  if (!all.length){
    html=html.slice(0,html.indexOf('<div class="wbStats">'));
    html += '<div class="empty emptyStudy"><div class="eyebrow">A LITTLE PRACTICE, EVERY DAY</div><h2>把难点，慢慢变成会的。</h2><p>收藏想回顾的题目，留下自己的错因。这里会成为你的专属复习清单。</p><a class="btn" href="#/">去做第一题 →</a></div>';

    if (keep) { app.innerHTML = html; window.scrollTo(0, y); } else app.innerHTML = html;
    return;
  }

  html += '<div class="wbBar">'
    + '<div class="wbSeg">' + WB_FILTERS.map(f =>
        '<button type="button" data-act="filter" data-k="' + f.k + '" class="'
        + (WB_FILTER === f.k ? 'on' : '') + '">' + f.t + '</button>').join('') + '</div>'
    + '<select class="sel" id="wbSubj" data-act="subject">'
      + '<option value="all"' + (WB_SUBJECT === 'all' ? ' selected' : '') + '>全部科目</option>'
      + WB_SUBJ_ORDER.map(s => '<option value="' + s + '"'
          + (WB_SUBJECT === s ? ' selected' : '') + '>' + WB_SUBJ_SHORT[s] + '</option>').join('')
    + '</select>'
    + '<input type="search" id="wbQ" placeholder="搜题目 / 搜你写的备注" value="' + escAttr(WB_Q) + '">'
    + '<button type="button" class="wbBtn primary" data-act="random"'
      + (shown.length ? '' : ' disabled') + '>随机巩固一题</button>'
    + '</div>';

  if (!shown.length){
    const curName = (WB_FILTERS.find(f => f.k === WB_FILTER) || {}).t || '这个筛选';
    /* 空态不能只说「没有」—— 得告诉人「东西在哪」，而且能一键跳过去。
       老用户的 localStorage 里可能还存着旧的默认值 `wrong`，全靠这块兜。 */
    const other = [['wrong', '待攻克', cnt.wrong], ['starred', '收藏', cnt.starred],
                   ['noted', '有备注', cnt.noted], ['solved', '已满分', cnt.solved]]
                  .filter(x => x[0] !== WB_FILTER && x[2] > 0);
    html += '<div class="empty">'
      + (WB_Q ? '没有匹配「' + esc(WB_Q) + '」的题目。' : '「' + curName + '」里暂时是空的。')
      + (other.length
          ? '<div class="wbJump">别的分组还有：'
            + other.map(x => '<button type="button" class="wbChip" data-act="filter" data-k="'
                + x[0] + '">' + x[1] + ' ' + x[2] + '</button>').join('') + '</div>'
          : '')
      + '</div>';
  } else {
    /* 按科目分组，组内保持题库顺序（讲次顺序） */
    const bySubj = {};
    shown.forEach(it => { (bySubj[it.subject || 'python'] = bySubj[it.subject || 'python'] || []).push(it); });
    const order = WB_SUBJ_ORDER.filter(s => bySubj[s])
      .concat(Object.keys(bySubj).filter(s => WB_SUBJ_ORDER.indexOf(s) < 0));
    order.forEach(s => {
      html += '<div class="wbGrp">' + (WB_SUBJ_SHORT[s] || s) + ' · ' + bySubj[s].length + ' 题</div>';
      html += '<div class="wbList">' + bySubj[s].map(wbRow).join('') + '</div>';
    });
  }

  app.innerHTML = html;
  if (keep) window.scrollTo(0, y);
  else window.scrollTo(0, 0);
}

async function wbSaveNote(box, pid){
  const ta = box.querySelector('.wbEditor textarea');
  const val = ta.value;
  const r = await saveMastery(pid, { note: val });
  if (r === null) return;                      // 校验没过，编辑器留着让人改
  const v = (r.note !== undefined ? r.note : val) || '';
  const view = box.querySelector('.wbNote');
  view.textContent = v || '＋ 写一句错因 / 下次注意什么';
  view.classList.toggle('empty', !v);
  wbCloseEditor(box);
  if (v) toast('备注已保存', 'ok');
  /* 筛选是「有备注」时，清空备注这一行就该消失 —— 重绘一下最省事。
     ★ 只在错题本页重绘：题面里也有同一个备注框，在那里保存不该把人
       甩到错题本去。 */

function wbBind(){
  const app = document.getElementById('app');
  if (!app || app.dataset.wbBound === '1') return;
  app.addEventListener('click', async (ev) => {
    /* 星标：列表 / 题面 / 错题本三处共用 [data-star] */
    const st = ev.target.closest('[data-star]');
    if (st){ ev.preventDefault(); ev.stopPropagation(); toggleStar(parseInt(st.dataset.star, 10), ev); return; }

    const actEl = ev.target.closest('[data-act]');
    if (!actEl) return;
    const act = actEl.dataset.act;

    if (act === 'filter'){
      wbState('filter', actEl.dataset.k);
      viewWrongbook();
      return;
    }
    if (act === 'random'){
      const all = await wrongbookData();
      const pool = all.filter(it => wbMatch(it, WB_FILTER, WB_SUBJECT, WB_Q));
      if (!pool.length) return;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      toast('来，第 ' + pick.id + ' 题：' + pick.title);
      location.hash = '#/p/' + pick.id;
      return;
    }
    const box = actEl.closest('.wbItem') || actEl.closest('[data-pnotebox]');
    if (!box) return;
    const pid = parseInt(box.dataset.pid || box.dataset.pnotebox, 10);
    if (!pid) return;

    if (act === 'edit'){
      const it = (await wrongbookData()).find(x => x.id === pid) || {};
      wbOpenEditor(box, it);
      return;
    }
    if (act === 'cancel'){ wbCloseEditor(box); return; }
    if (act === 'save'){ await wbSaveNote(box, pid); return; }
    if (act === 'delnote'){
      box.querySelector('.wbEditor textarea').value = '';
      await wbSaveNote(box, pid);
      return;
    }
    if (act === 'lvl'){
      const btn = ev.target.closest('button[data-l]');
      if (!btn) return;
      const n = parseInt(btn.dataset.l, 10);
      const r = await saveMastery(pid, { level: n });
      if (r === null) return;
      box.querySelectorAll('.wbLvl button').forEach(b =>
        b.classList.toggle('on', parseInt(b.dataset.l, 10) === n));
      return;
    }
  });
  app.addEventListener('change', (ev) => {
    if (ev.target.id === 'wbSubj'){ wbState('subject', ev.target.value); viewWrongbook(); }
  });
  app.addEventListener('input', (ev) => {
    if (ev.target.id !== 'wbQ') return;
    clearTimeout(window._wbQT);
    const v = ev.target.value;
    window._wbQT = setTimeout(() => {
      wbState('q', v);
      viewWrongbook({ keepScroll: true });
      const q = document.getElementById('wbQ');
      if (q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }, 220);
  });
  app.dataset.wbBound = '1';
}

/* =========================================================================
   10.5 视图六：笔记（Obsidian 笔记区）
   ------------------------------------------------------------------
   数据是构建期由 tools/export_notes.py 转好的静态 JSON，全部同源 fetch，
   离线（没有后端）时照样能看 —— 跟题库一个待遇。
   ========================================================================= */
let NOTES_INDEX = null;       // notes/index.json    目录树
let NOTES_SEARCH = null;      // notes/search.json   全文索引（进搜索才拉）
let NOTES_RENDER = null;      // notes/notes.js 里的 renderNotes
let NOTES_LOAD = null;
let NOTES_TRY = 0;
let SEARCH_TIMER = null;

/* 渲染器按需下载（124 KB）。★ 与编辑器同款的两个坑：
   ① 我们自己缓存了 promise，一旦 rejected 就会「一次没加载上、终生用不了」；
   ② 浏览器对加载失败的动态 import 也按 URL 记住结果。
   所以失败时既清缓存、也换个 URL 再试。 */
async function notesRender(){
  if (!NOTES_RENDER){
    if (!NOTES_LOAD){
      const url = './notes/notes.js' + (NOTES_TRY ? '?retry=' + NOTES_TRY : '');
      NOTES_LOAD = import(url).catch(err => { NOTES_LOAD = null; NOTES_TRY++; throw err; });
    }
    NOTES_RENDER = (await NOTES_LOAD).renderNotes;
  }
  return NOTES_RENDER;
}

async function loadNotesIndex(){
  if (NOTES_INDEX) return NOTES_INDEX;
  const res = await fetch('notes/index.json', { cache:'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  NOTES_INDEX = await res.json();
  return NOTES_INDEX;
}

async function loadNotesSearch(){
  if (NOTES_SEARCH) return NOTES_SEARCH;
  const res = await fetch('notes/search.json', { cache:'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  NOTES_SEARCH = await res.json();
  return NOTES_SEARCH;
}

async function loadNotesPage(slug){
  const res = await fetch('notes/p/' + slug + '.json', { cache:'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

const SUBJECT_LINE = { python:'py', ds:'ds', linux:'linux' };
const LINE_SUBJECT = { py:'python', ds:'ds', linux:'linux' };

function lectureNo(group){ const m = /^(\d+)/.exec(String(group||'')); return m ? m[1] : ''; }

/* 笔记里的 slug → 题目来源 section 是「第 NN 讲 · XXX」，两边靠**讲号**对上
   （讲名对不上：题目写「第 07 讲 · 函数」，笔记目录是「07讲_函数上」）。 */
function probsOfLecture(line, lectureNoStr){
  const n = parseInt(lectureNoStr, 10);
  if (!n) return [];
  return (PROBLEMS || []).filter(p =>
    SUBJECT_LINE[p.subject] === line && lecOf(p.source_section) === n);
}

/* 题目 → 笔记。靠 subject + 「第 NN 讲」的**讲号**对上：
   讲名两边写法不一致（题目写「第 07 讲 · 函数」，笔记目录是「07讲_函数上」），
   只有讲号是稳的。另外 Linux 线有两类来源不是讲次：
   「基础命令 · X」→ Linux基础命令.md，「实验 N · X」→ Linux实验题库.md。 */
function noteSlugForProblem(p){
  const sec = String(p.source_section || '');
  const line = SUBJECT_LINE[p.subject || 'python'];
  if (!line) return '';
  if (/基础命令/.test(sec)) return 'linux-cmd';
  if (/^实验/.test(sec)) return 'linux-bank';
  const m = /第\s*(\d+)\s*讲/.exec(sec);
  if (m) return line + '-' + String(parseInt(m[1], 10)).padStart(2, '0') + '-00';
  return '';
}

function noteChipFor(p){
  const slug = noteSlugForProblem(p);
  if (!slug) return '';
  return '<a class="pill p-note" href="#/notes/' + slug
    + '" title="打开这一讲的笔记">看本讲笔记</a>';
}

function searchBoxHtml(id, ph){
  return '<div class="noteSearch">'
    + '<input id="' + id + '" type="search" autocomplete="off" placeholder="'
    + esc(ph || '搜笔记：标题、正文都能搜') + '">'
    + '<div class="noteSearchOut" id="' + id + 'Out"></div></div>';
}

function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function searchSnippet(text, term){
  text=String(text).replace(/:::callout[^\n]*/g,' ').replace(/[#*`>|]/g,' ').replace(/\s+/g,' ').trim();
  const i = text.toLowerCase().indexOf(term.toLowerCase());
  if (i < 0) return esc(text.slice(0, 90)) + '…';
  const from = Math.max(0, i - 45);
  const raw = (from ? '…' : '') + text.slice(from, i + 75) + '…';
  return esc(raw).replace(new RegExp(escRe(esc(term)), 'gi'), m => '<mark>' + m + '</mark>');
}

function runNoteSearch(q){
  const kw = q.trim().toLowerCase();
  if (!kw || !NOTES_SEARCH) return [];
  const terms = kw.split(/\s+/).filter(Boolean);
  const hit = [];
  for (const it of NOTES_SEARCH.items){
    const title = (it.t || '').toLowerCase();
    const body = (it.x || '').toLowerCase();
    let score = 0, ok = true;
    for (const t of terms){
      const inT = title.indexOf(t) >= 0, inB = body.indexOf(t) >= 0;
      if (!inT && !inB){ ok = false; break; }
      score += inT ? 12 : 1;                    // 命中标题远比命中正文值钱
    }
    if (!ok) continue;
    hit.push({ s: it.s, t: it.t, b: it.b, score, snip: searchSnippet(it.x || '', terms[0]) });
  }
  hit.sort((a, b) => b.score - a.score);
  return hit;
}

function renderNoteSearch(outId, q, limit=40){
  const out = document.getElementById(outId);
  if (!out) return;
  const kw = q.trim();
  if (!kw){ out.innerHTML = ''; out.style.display = 'none'; return; }
  if (!NOTES_SEARCH){
    out.style.display = 'block';
    out.innerHTML = '<div class="nsHint">正在加载搜索索引…</div>';
    loadNotesSearch().then(() => {
      const input = document.getElementById(outId.replace(/Out$/, ''));
      if (input && input.value.trim() === kw) renderNoteSearch(outId, input.value);
    }).catch(e => {
      out.innerHTML = '<div class="nsHint">搜索索引加载失败：' + esc(String(e.message || e)) + '</div>';
    });
    return;
  }
  const hits = runNoteSearch(kw);
  out.style.display = 'block';
  if (!hits.length){
    out.innerHTML = '<div class="nsHint">没搜到「' + esc(kw) + '」</div>';
    return;
  }
  out.dataset.query=q; out.dataset.limit=String(limit);
  out.innerHTML = '<div class="nsCnt">共 ' + hits.length + ' 篇，展示 ' + Math.min(limit,hits.length) + ' 篇</div>' + hits.slice(0,limit).map(h =>
    '<a class="nsItem" href="#/notes/' + h.s + '">'
    + '<div class="nsTitle">' + esc(h.t) + '</div>'
    + '<div class="nsCrumb">' + esc(h.b) + '</div>'
    + '<div class="nsSnip">' + h.snip + '</div></a>').join('') + (hits.length>limit ? '<button type="button" class="btn ghost" onclick="moreNoteSearch(this)">加载更多</button>' : '');
}

function moreNoteSearch(button){const out=button.parentElement;const scroll=out.scrollTop;renderNoteSearch(out.id,out.dataset.query,Number(out.dataset.limit)+40);out.style.display='block';out.scrollTop=scroll;out.querySelectorAll('.nsItem')[Number(out.dataset.limit)-40]?.focus();}
function bindNoteSearch(inputId){
  const el = document.getElementById(inputId);
  if (!el) return;
  const out = document.getElementById(inputId + 'Out');
  el.addEventListener('input', () => {
    clearTimeout(SEARCH_TIMER);
    SEARCH_TIMER = setTimeout(() => renderNoteSearch(inputId + 'Out', el.value), 140);
  });
  el.addEventListener('focus', () => { if (el.value.trim()) renderNoteSearch(inputId + 'Out', el.value); });
  el.parentElement.addEventListener('keydown', e => {
    if (e.isComposing) return;
    if (e.key === 'Escape') { clearTimeout(SEARCH_TIMER); out.style.display='none'; el.focus(); out.style.display='none'; return; }
    const hits = [...out.querySelectorAll('.nsItem')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      out.style.display='block';
      const i=hits.indexOf(document.activeElement), delta=e.key==='ArrowDown' ? 1 : -1;
      if (hits.length) hits[(i + delta + hits.length) % hits.length].focus();
    } else if (e.key === 'Enter' && document.activeElement === el && hits.length && out.style.display !== 'none') {
      e.preventDefault(); location.hash=hits[0].getAttribute('href');
    }
  });
  el.parentElement.addEventListener('focusout', e => {
    if (!el.parentElement.contains(e.relatedTarget)) { clearTimeout(SEARCH_TIMER); out.style.display='none'; }
  });
}

function findHeading(a){
  const want = String(a).trim();
  const slug = want.replace(/\s+/g, '-');

  for (const h of document.querySelectorAll('#noteBody h1,#noteBody h2,#noteBody h3,#noteBody h4,#noteBody h5,#noteBody h6')){

    if (t === want || t.replace(/\s+/g, '-') === slug) return h;

  return null;

    html += '<nav class="notePager">'
      + (page.prev ? '<a href="#/notes/' + page.prev.slug + '">← ' + esc(page.prev.title) + '</a>' : '<span></span>')
      + (page.next ? '<a href="#/notes/' + page.next.slug + '">' + esc(page.next.title) + ' →</a>' : '<span></span>')
      + '</nav>';
  }
  html += '</article></div>';
  app.innerHTML = html;

  /* 「本讲有 N 道题」——笔记与题库双向联动的另一半 */
  const pb = document.getElementById('noteProbs');
  if (pb && page.lecture){
    const list = probsOfLecture(page.line, page.lecture);
    if (list.length){
      const done = list.filter(p => (bestOf(p) || 0) > 0).length;
      pb.innerHTML = '<div class="notePbar">本讲配了 <b>' + list.length + '</b> 道题'
        + (done ? '（已做 ' + done + '）' : '') + ' · '
        + '<a href="#/set/' + (LINE_SUBJECT[page.line] || 'python') + '/lecture/' + encodeURIComponent(page.lecture) + '/from/' + encodeURIComponent(slug) + '">练习本讲题目 →</a></div>';
    }
  }

  polishNoteLabels();
  if (anchor){
    const el = findHeading(anchor);
    if (el){
      el.scrollIntoView({ block:'start' });
      el.classList.add('anchorFlash');
      setTimeout(() => el.classList.remove('anchorFlash'), 1600);
    }
  }
}

/* =========================================================================
   11. 设置弹层
   ========================================================================= */
let modalReturnFocus = null;
function appearancePrefs(){try{return JSON.parse(localStorage.getItem('pta.appearance') || '{}')}catch(e){return {}}}
function setAppearance(key,value){
  const a={...appearancePrefs(),[key]:value};
  try{localStorage.setItem('pta.appearance',JSON.stringify(a))}catch(e){}
  document.documentElement.dataset.theme=a.theme || 'system';
  document.documentElement.dataset.density=a.density || 'comfortable';
  document.documentElement.style.setProperty('--reading-size',([15,16,18].includes(Number(a.size))?a.size:16)+'px');
}
function openSettings(){
  modalReturnFocus=document.activeElement;
  const a=appearancePrefs(), opts=(values,current)=>values.map(([v,t])=>'<option value="'+v+'"'+(String(current)===String(v)?' selected':'')+'>'+t+'</option>').join('');
  document.getElementById('modalHost').innerHTML='<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">'
    + '<div class="modalHead" id="settingsTitle">让学习更合心意<button aria-label="关闭设置" class="x" onclick="closeModal()">✕</button></div><div class="modalBody">'
    + '<fieldset class="settingsGroup"><legend>外观与阅读 · 即时保存</legend><div class="settingsRow">'
    + '<div class="field"><label class="lb" for="appearanceTheme">主题</label><select id="appearanceTheme" onchange="setAppearance(\'theme\',this.value)">'+opts([['system','跟随系统'],['light','浅色 · 纸页'],['dark','深色 · 夜读']],a.theme || 'system')+'</select></div>'
    + '<div class="field"><label class="lb" for="appearanceSize">正文字号</label><select id="appearanceSize" onchange="setAppearance(\'size\',this.value)">'+opts([[15,'15 px'],[16,'16 px · 推荐'],[18,'18 px']],a.size || 16)+'</select></div>'
    + '<div class="field"><label class="lb" for="appearanceDensity">列表密度</label><select id="appearanceDensity" onchange="setAppearance(\'density\',this.value)">'+opts([['comfortable','舒适'],['compact','紧凑']],a.density || 'comfortable')+'</select></div>'
    + '<div class="field"><label class="lb" for="setNick">昵称</label><input id="setNick" value="'+escAttr(nickname())+'" placeholder="如何称呼你"></div></div></fieldset>'
    + '<fieldset class="settingsGroup"><legend>学习资料</legend><div class="btnrow" style="margin:0"><button class="btn ghost" onclick="exportProgress()">导出进度</button><button class="btn ghost" onclick="document.getElementById(\'impFile\').click()">导入进度</button><input id="impFile" type="file" hidden accept=".json,application/json" onchange="importProgress(event)"></div>'
    + '<p class="hintline">换设备或清理浏览器前，记得留一份备份。</p><details class="settingsHelp"><summary>备份范围与合并规则</summary><p>包含成绩、提交记录、收藏、错因、自评与草稿。合并保留最高分，同一提交不会重复累计；备注冲突优先保留本机版本。</p></details></fieldset>'
    + '<details class="settingsAdvanced"><summary>高级设置 · 后端连接与通行证</summary><div class="field"><label class="lb" for="setApi">判题后端地址</label><input id="setApi" value="'+escAttr(apiBase())+'" placeholder="例如 https://example.com"><div class="desc">浏览器判题无需配置；连接后端后可同步学习资料。</div></div>'
    + '<div class="field"><label class="lb" for="setToken">我的通行证</label><input id="setToken" readonly value="'+escAttr(TOKEN)+'" onclick="this.select()"><div class="desc">通行证用于识别你的后端进度，换设备时随备份恢复。</div></div><button class="btn ghost" style="margin-top:14px" onclick="refreshAll().then(()=>{closeModal();route()})">重新连接</button></details>'
    + '<div class="modalFooter"><button class="btn" onclick="saveSettings()">保存</button><button class="btn ghost" onclick="closeModal()">取消</button></div></div></div></div>';
  document.getElementById('setNick').focus();
}

function closeModal(){
  const host = document.getElementById('modalHost');
  if (!host.firstElementChild) return;
  host.innerHTML = '';
  if (modalReturnFocus && modalReturnFocus.isConnected) modalReturnFocus.focus();
  modalReturnFocus = null;
}
function saveSettings(){
  const n = document.getElementById('setNick').value.trim();
  const a = document.getElementById('setApi').value.trim().replace(/\/+$/,'');
  try { localStorage.setItem(LS.nick, n); localStorage.setItem(LS.api, a); } catch(e){}
  closeModal();
  renderNav();
  boot(true);
}

/* =========================================================================
   11b. 进度导出 / 导入
   离线判题的进度活在 localStorage 里 —— 清一次缓存、换一个浏览器就没了。
   云同步要一台服务器，而这件事「导出一个文件」就能兜住大半，成本几乎为零。
   ========================================================================= */
function progressBundle(){
  const drafts = {};
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && (/^pta\.draft\.\d+$/.test(k) || /^pta\.practice\.(note|stdin)\.\d+$/.test(k))){
        const v = localStorage.getItem(k);
        if (v) drafts[k] = v;
      }
    }
  } catch(e){}
  return {
    kind: 'my-pta-progress', version: 1, exported_at: nowStamp(),
    token: TOKEN, nickname: nickname(), apiBase: apiBase(),
    local: localProgress(), drafts: drafts, submissions: localSubmissions(), mastery: masteryAll(),
  };
}

function exportProgress(){
  const b = progressBundle();
  const d = new Date(), p = n => String(n).padStart(2,'0');
  const name = 'pta-progress-' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate())
             + '-' + p(d.getHours()) + p(d.getMinutes()) + '.json';
  const url = URL.createObjectURL(new Blob([JSON.stringify(b, null, 2)], { type:'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('已导出：' + Object.keys(b.local).length + ' 道题 + '
        + Object.keys(b.drafts).length + ' 份草稿 + ' + Object.keys(b.mastery).length + ' 条复习标注', 'ok');
}

function importProgress(ev){
  const input = ev && ev.target;
  const f = input && input.files && input.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let b = null;
    try { b = JSON.parse(String(rd.result || '')); } catch(e){}
    if (!b || b.kind !== 'my-pta-progress' || !b.local || typeof b.local !== 'object'){
      toast('这不是本平台导出的进度文件', 'err');
      if (input) input.value = '';
      return;
    }
    /* ★ 合并规则：分数取 max、次数取保守最大值，提交记录另去重。
       绝不能直接覆盖 —— 导一份旧备份不该把现在的高分抹掉。 */
    const m = localProgress();
    let improved = 0;
    Object.keys(b.local).forEach(pid => {
      const nv = b.local[pid] || {}, ov = m[pid] || {};
      const ob = parseInt(ov.best_score || 0, 10) || 0;
      const nb = Math.max(ob, parseInt(nv.best_score || 0, 10) || 0);
      const nt = parseInt(nv.total_score || 0, 10) || parseInt(ov.total_score || 0, 10) || 0;
      if (nb > ob) improved++;
      m[pid] = {
        best_score: nb, total_score: nt,
        attempts: Math.max(parseInt(ov.attempts || 0, 10) || 0, parseInt(nv.attempts || 0, 10) || 0),
        solved_at: (nt > 0 && nb >= nt) ? (ov.solved_at || nv.solved_at || nowStamp()) : '',
      };
    });
    try { localStorage.setItem(LS.local, JSON.stringify(m)); } catch(e){}
    if (Array.isArray(b.submissions)) {
      const incoming = b.submissions.filter(x => x && Number.isFinite(x.problem_id) && typeof x.created_at === 'string' && typeof x.verdict === 'string').map(x => ({
        problem_id:x.problem_id, created_at:x.created_at, verdict:x.verdict, source:'local', code:String(x.code || ''), lang:String(x.lang || ''),
        score:Number(x.score)||0, max_score:Number(x.max_score)||0, passed:Number(x.passed)||0, total:Number(x.total)||0
      }));
      const merged = new Map();
      [...localSubmissions(), ...incoming].forEach(x => merged.set(JSON.stringify([x.problem_id,x.created_at,x.code,x.verdict]), x));
      const counts = {};
      for (const item of merged.values()) counts[item.problem_id] = (counts[item.problem_id] || 0) + 1;
      Object.keys(counts).forEach(pid => { if (m[pid]) m[pid].attempts = Math.max(m[pid].attempts, counts[pid]); });
      try { localStorage.setItem(LS.local, JSON.stringify(m)); } catch(e){}
      try { localStorage.setItem(LOCAL_SUBMISSIONS, JSON.stringify([...merged.values()].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)))); } catch(e){ toast('提交历史未能恢复，请检查浏览器存储空间','err'); }
    }
    let noteConflicts = 0;
    if (b.mastery && typeof b.mastery === 'object' && !Array.isArray(b.mastery)) {
      const all = masteryAll();
      Object.keys(b.mastery).filter(pid => /^\d+$/.test(pid)).forEach(pid => {
        const incoming = b.mastery[pid];
        if (!incoming || typeof incoming !== 'object') return;
        const current = all[pid] || {};
        const note = typeof incoming.note === 'string' ? incoming.note.slice(0, NOTE_MAX) : '';
        if (current.note && note && current.note !== note) noteConflicts++;
        all[pid] = {...current, _dirty:true,
          _remoteNote:current._remoteNote || (typeof incoming._remoteNote === 'string' ? incoming._remoteNote.slice(0,NOTE_MAX) : ''),
          is_starred: current.is_starred || incoming.is_starred ? 1 : 0,
          note: current.note || note,
          level: [0,1,2].includes(current.level) ? current.level : ([0,1,2].includes(incoming.level) ? incoming.level : 0)};
      });
      _masteryWrite(all);
    }
    /* 草稿：只在本地还没有时补，不覆盖正在写的内容 */
    let sk = 0;
    if (b.drafts) Object.keys(b.drafts).forEach(k => {
      if (!/^pta\.draft\.\d+$/.test(k) && !/^pta\.practice\.(note|stdin)\.\d+$/.test(k)) return;
      try { if (localStorage.getItem(k) === null && typeof b.drafts[k] === 'string'){ localStorage.setItem(k, b.drafts[k]); sk++; } } catch(e){}
    });
    /* 通行证：这份文件本来就是为了「把这台设备变成那台设备」才导出的，
       所以文件里带着合法通行证、且与当前不同时，就采用它（后端进度才跟得回来）。 */
    let switched = false;
    if (typeof b.token === 'string' && /^[0-9a-f]{16,64}$/.test(b.token) && b.token !== TOKEN){
      TOKEN = b.token;
      try { localStorage.setItem(LS.token, TOKEN); } catch(e){}
      switched = true;
    }
    if (b.nickname){ try { localStorage.setItem(LS.nick, String(b.nickname)); } catch(e){} }
    if (input) input.value = '';
    toast('已导入：' + improved + ' 道题分数变高'
          + (sk ? '，补了 ' + sk + ' 份草稿' : '')
          + (noteConflicts ? '；' + noteConflicts + ' 处备注冲突保留本机版本，备份原文仍在文件中' : '')
          + (switched ? '；通行证已切回 ' + TOKEN.slice(0, 8) + '…' : ''), 'ok');
    closeModal();
    refreshAll().then(() => { route(); });
  };
  rd.onerror = () => { toast('读文件失败', 'err'); if (input) input.value = ''; };
  rd.readAsText(f, 'utf-8');
}

/* =========================================================================
   12. 启动
   ========================================================================= */
async function boot(isReload){
  TOKEN = ensureToken();
  document.getElementById('navUser').textContent = nickname();
  wbBind();            // 错题本的交互委托（#app 一直存在，绑一次就够）
  wbRestoreState();    // 上次的筛选条件读回来
  /* ★ 顺序不能换：离线兜底的科目目录是**从题库现聚合出来的**，
     题库还没到手就去聚合，主页会渲染出「0 个题集」的空壳。 */
  await loadMeta();
  await loadProblems();
  await loadCatalog();
  /* 收藏/备注的本地副本要等 loadProblems 定下 OFFLINE 再决定要不要拉服务端 */
  await syncMasteryFromServer();
  renderNav();
  route();
  if (isReload) toast(OFFLINE ? '仍连不上后端，保持离线浏览' : '已连上后端', OFFLINE ? 'err' : 'ok');
}

/* 快捷键：Esc 关弹层 */
document.addEventListener('keydown', e => {
  const dialog = document.querySelector('#modalHost [role="dialog"]');
  if (!dialog) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
  if (e.key !== 'Tab') return;
  const controls = [...dialog.querySelectorAll('button,input,select,textarea,a[href]')].filter(x => !x.disabled && x.getClientRects().length);
  const first = controls[0], last = controls[controls.length - 1];
  if (e.shiftKey && (document.activeElement === first || !dialog.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (document.activeElement === last || !dialog.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
});
