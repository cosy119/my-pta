<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cosy 题集 · 在线判题</title>
<!-- ★ 内联 SVG 图标：浏览器默认会去要 /favicon.ico，没图标就每次控制台一个 404。
     写成 data: URI 既不产生请求，也不用往 docs/ 里塞二进制。 -->

</script>
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --panel2:#f9fafc; --panel3:#f1f4f9;
  --border:#e2e7f0; --border2:#eef1f7;
  --text:#1c2430; --text2:#4a5568; --muted:#626f83;
  --primary:#2f6bed; --primary2:#1f57d6; --primaryWeak:#e9f0ff;
  --ok:#12a150; --okWeak:#e6f7ee;
  --warn:#e08c00; --warnWeak:#fff6e0;
  --err:#dc3b34; --errWeak:#fdeceb;
  --info:#0d8fd9; --infoWeak:#e6f5fd;
  --purple:#7b5cf0;
  --radius:12px; --radius2:8px;
  --shadow:0 1px 2px rgba(20,32,60,.05), 0 6px 18px rgba(20,32,60,.05);
  --shadow2:0 2px 6px rgba(20,32,60,.07), 0 16px 40px rgba(20,32,60,.09);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1319; --panel:#161d26; --panel2:#1b232e; --panel3:#212b38;
    --border:#2a3543; --border2:#232d39;
    --text:#e6ecf4; --text2:#b3bece; --muted:#9aa7ba;
    --primary:#5b8bff; --primary2:#7ba3ff; --primaryWeak:#1c2a45;
    --ok:#3ecf7f; --okWeak:#14301f;
    --warn:#f0b429; --warnWeak:#332a12;
    --err:#f26b62; --errWeak:#341a18;
    --info:#4bb8ea; --infoWeak:#122c3a;
    --purple:#a08cff;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.28);
    --shadow2:0 4px 10px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.65;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--primary); text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
input,select,textarea{font-family:inherit; color:var(--text)}

/* ---------- 顶栏 ---------- */
.nav{
  position:sticky; top:0; z-index:50; height:56px; display:flex; align-items:center;
  gap:18px; padding:0 22px; background:var(--panel);
  border-bottom:1px solid var(--border); box-shadow:0 1px 3px rgba(20,32,60,.04);
}
.brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:16px; cursor:pointer; white-space:nowrap}
.brand .logo{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--primary),#6a5cf0); font-size:13px; font-weight:800;
}
.navlinks{display:flex; gap:4px; margin-left:6px}
.navlinks a{
  padding:6px 12px; border-radius:8px; color:var(--text2); font-size:13.5px; font-weight:500;
}
.navlinks a:hover{background:var(--panel3); text-decoration:none; color:var(--text)}
.navlinks a.on{background:var(--primaryWeak); color:var(--primary); font-weight:600}
.navsp{flex:1}
.navright{display:flex; align-items:center; gap:12px; font-size:13px; color:var(--text2)}
.navscore{font-variant-numeric:tabular-nums}
.navscore b{color:var(--primary); font-size:14px}
.iconbtn{
  border:1px solid var(--border); background:var(--panel); color:var(--text2);
  border-radius:8px; padding:6px 11px; cursor:pointer; font-size:13px;
}
.iconbtn:hover{border-color:var(--primary); color:var(--primary)}
.offlineTag{
  font-size:12px; padding:3px 9px; border-radius:20px; background:var(--warnWeak); color:var(--warn);
  border:1px solid rgba(224,140,0,.25); white-space:nowrap;
}

/* ---------- 布局 ---------- */
.wrap{max-width:1240px; margin:0 auto; padding:22px 22px 70px}
#app.problemView{max-width:1680px; margin:0 auto; padding:16px 18px 40px}
.crumb{font-size:13px; color:var(--muted); margin-bottom:14px}
.crumb a{color:var(--text2)}
.crumb .sep{margin:0 7px; opacity:.55}

/* ---------- 题集广场 ---------- */
.hero{
  display:flex; gap:26px; align-items:stretch; padding:24px 26px; border-radius:16px;
  background:linear-gradient(120deg,#2f6bed 0%,#4a54e0 55%,#7b5cf0 100%);
  color:#fff; box-shadow:var(--shadow2); margin-bottom:26px; flex-wrap:wrap;
}
.hero-l{flex:1 1 300px; min-width:260px}
.hero-hi{font-size:20px; font-weight:700; margin-bottom:6px}
.hero-sub{font-size:13px; color:rgba(255,255,255,.82); line-height:1.7}
.hero-r{flex:0 0 380px; min-width:280px; display:flex; flex-direction:column; justify-content:center; gap:10px}
.scoreRow{display:flex; align-items:baseline; gap:9px}
.scoreBig{font-size:38px; font-weight:800; letter-spacing:-1px; font-variant-numeric:tabular-nums; line-height:1}
.scoreOf{font-size:14px; color:rgba(255,255,255,.75)}
.hero .bar{background:rgba(255,255,255,.24)}
.hero .bar>i{background:#fff}
.heroStats{display:flex; gap:20px; flex-wrap:wrap; font-size:12.5px; color:rgba(255,255,255,.85)}
.heroStats b{display:block; font-size:17px; font-weight:700; color:#fff; font-variant-numeric:tabular-nums}

.secTitle{font-size:15px; font-weight:700; margin:0 0 13px; display:flex; align-items:center; gap:9px}
.secTitle .cnt{font-size:12px; font-weight:500; color:var(--muted)}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:16px}
.card{
  display:block; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 18px 14px; box-shadow:var(--shadow); color:inherit;
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}
.card:hover{transform:translateY(-2px); box-shadow:var(--shadow2); border-color:var(--primary); text-decoration:none}
.cardTop{display:flex; align-items:center; gap:12px; margin-bottom:13px}
.cardIco{
  width:44px;height:44px;border-radius:11px; display:grid; place-items:center; flex:0 0 44px;
  font-weight:800; font-size:15px; color:#fff; letter-spacing:.3px;
}
.i-python{background:linear-gradient(135deg,#3776ab,#ffd343)}
.i-ds{background:linear-gradient(135deg,#0f9b6c,#37c99a)}
.i-linux{background:linear-gradient(135deg,#3a4a5c,#6b7c93)}
.cardName{font-size:15px; font-weight:700; line-height:1.35}
.cardMeta{font-size:12px; color:var(--muted); margin-top:3px}
.cardPct{margin-left:auto; font-size:19px; font-weight:800; color:var(--primary); font-variant-numeric:tabular-nums}
.cardPct small{font-size:11px; font-weight:600; color:var(--muted); margin-left:1px}

.bar{height:7px; border-radius:20px; background:var(--panel3); overflow:hidden}
.bar>i{display:block; height:100%; width:0; border-radius:20px; background:linear-gradient(90deg,var(--primary),#6a5cf0); transition:width .4s ease}
.bar.sm{height:6px}
.bar.tiny{height:4px; flex:1; min-width:50px}

.cardGroups{margin:13px 0 11px; display:flex; flex-direction:column; gap:7px; max-height:184px; overflow:auto}
.cardGrp{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--text2)}
.cardGrp .nm{flex:0 0 auto; max-width:172px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cardGrp .num{flex:0 0 auto; font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px}
.cardGrp.done .nm{color:var(--ok)}
.cardFoot{
  display:flex; align-items:center; gap:12px; padding-top:11px; border-top:1px dashed var(--border);
  font-size:12.5px; color:var(--muted);
}
.cardFoot .go{margin-left:auto; color:var(--primary); font-weight:600}

/* ---------- 题集内页 ---------- */
.setHead{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow); margin-bottom:16px;
}
.setTitleRow{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.setTitle{font-size:18px; font-weight:700}
.pill{
  font-size:12px; padding:2.5px 9px; border-radius:20px;
  background:var(--panel3); color:var(--text2); border:1px solid var(--border); white-space:nowrap;
}
.pill.p-ok{background:var(--okWeak); color:var(--ok); border-color:rgba(18,161,80,.24)}
.pill.p-pri{background:var(--primaryWeak); color:var(--primary); border-color:rgba(47,107,237,.24)}
.pill.p-warn{background:var(--warnWeak); color:var(--warn); border-color:rgba(224,140,0,.26)}
/* 题目 → 笔记的入口（笔记与题库互跳的那一半） */
.pill.p-note{background:var(--primaryWeak); color:var(--primary); border-color:rgba(47,107,237,.3); font-weight:600; cursor:pointer}
a.pill.p-note:hover{border-color:var(--primary); text-decoration:none; filter:brightness(.97)}
.setStats{display:flex; gap:26px; flex-wrap:wrap; margin-top:14px; font-size:12.5px; color:var(--muted)}
.setStats b{display:block; font-size:18px; color:var(--text); font-weight:700; font-variant-numeric:tabular-nums}
.setBarRow{display:flex; align-items:center; gap:12px; margin-top:13px}
.setBarRow .bar{flex:1}
.toolbar{
  display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:14px;
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:11px 13px; box-shadow:var(--shadow);
}
.fbtn{
  border:1px solid var(--border); background:var(--panel); color:var(--text2); border-radius:8px;
  padding:6px 13px; font-size:13px; cursor:pointer; transition:.12s;
}
.fbtn:hover{border-color:var(--primary); color:var(--primary)}
.fbtn.on{background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600}
.fbtn .n{opacity:.7; margin-left:4px; font-size:11.5px}
.typeSelect{border:1px solid var(--border); border-radius:8px; padding:6px 10px; background:var(--panel); color:var(--text2); font-size:13px; cursor:pointer}
.typeSelect:focus{outline:2px solid var(--primary); outline-offset:1px}
.searchBox{
  margin-left:auto; display:flex; align-items:center; gap:7px; border:1px solid var(--border);
  border-radius:8px; padding:5px 11px; background:var(--panel2); min-width:210px;
}
.searchBox:focus-within{border-color:var(--primary)}
.searchBox input{border:0; background:transparent; outline:0; flex:1; font-size:13px}
.searchBox svg{opacity:.5}

.grpbox{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:13px; overflow:hidden;
}
.grpHead{
  display:flex; align-items:center; gap:11px; padding:12px 16px; cursor:pointer;
  background:var(--panel2); border-bottom:1px solid var(--border2); user-select:none;
}
.grpHead:hover{background:var(--panel3)}
.grpHead .tri{transition:transform .16s; font-size:11px; color:var(--muted); width:11px; flex:0 0 11px}
.grpbox.closed .grpHead .tri{transform:rotate(-90deg)}
.grpbox.closed .grpHead{border-bottom-color:transparent}
.grpbox.closed .ptable{display:none}
.grpName{font-size:13.5px; font-weight:650}
.grpHead .grow{margin-left:auto; display:flex; align-items:center; gap:11px; min-width:0}
.grpHead .bar{width:120px; flex:0 0 120px}
.grpHead .num{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}

table.ptable{width:100%; border-collapse:collapse; font-size:13.5px}
table.ptable th{
  text-align:left; font-weight:600; font-size:12px; color:var(--muted); letter-spacing:.02em;
  padding:9px 12px; border-bottom:1px solid var(--border2); background:var(--panel); white-space:nowrap;
}
table.ptable td{padding:9px 12px; border-bottom:1px solid var(--border2); vertical-align:middle}
table.ptable tr:last-child td{border-bottom:0}
table.ptable tbody tr:hover{background:var(--panel2)}
td.c-st{width:52px; text-align:center}
td.c-no{width:56px; color:var(--muted); font-variant-numeric:tabular-nums; font-size:12.5px}
td.c-tt{min-width:210px}
td.c-tt a{font-weight:550; color:var(--text)}
td.c-tt a:hover{color:var(--primary)}
td.c-ty,td.c-df{width:98px; white-space:nowrap}
td.c-tg{max-width:250px}
td.c-sc{width:96px; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums}
.st{display:inline-block; width:19px; height:19px; border-radius:50%; line-height:19px; text-align:center; font-size:12px; font-weight:700}
.st.ok{background:var(--okWeak); color:var(--ok); border:1.5px solid var(--ok)}
.st.part{background:var(--warnWeak); color:var(--warn); border:1.5px solid var(--warn)}
.st.att{background:var(--errWeak); color:var(--err); border:1.5px solid var(--err)}
.st.none{background:transparent; color:var(--muted); border:1.5px solid var(--border); font-size:0}
.tyTag{font-size:11.5px; padding:2px 8px; border-radius:5px; background:var(--panel3); color:var(--text2); border:1px solid var(--border)}
.tyTag.t-code{background:var(--infoWeak); color:var(--info); border-color:rgba(13,143,217,.22)}
.tyTag.t-mc{background:var(--primaryWeak); color:var(--primary); border-color:rgba(47,107,237,.22)}
.tyTag.t-multi{background:var(--primaryWeak); color:var(--primary); border-color:rgba(47,107,237,.22)}
.tyTag.t-tf{background:var(--okWeak); color:var(--ok); border-color:rgba(18,161,80,.22)}
.tyTag.t-fill{background:#f3ecff; color:var(--purple); border-color:rgba(123,92,240,.22)}
.tyTag.t-short,.tyTag.t-practical{background:var(--panel3); color:var(--text2); border-color:var(--border)}
@media (prefers-color-scheme:dark){.tyTag.t-fill{background:#241d3d}}
.stars{color:#f0a92c; letter-spacing:1px; font-size:12px}
.stars .off{color:var(--border)}
.tag{display:inline-block; font-size:11.5px; padding:1.5px 7px; border-radius:5px; background:var(--panel3); color:var(--muted); margin-right:4px; border:1px solid var(--border2)}
.scGot{font-weight:700; color:var(--ok)}
.scZero{color:var(--muted)}
.scFull{color:var(--ok)}
.empty{
  text-align:center; padding:52px 20px; color:var(--muted); background:var(--panel);
  border:1px dashed var(--border); border-radius:var(--radius);
}

/* ---------- 题目页 ---------- */
.problemTop{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px}
.problemTop .crumb{margin:0}
.problemSteps{display:flex; gap:8px; flex:0 0 auto}
.problemSteps button{border:1px solid var(--border); border-radius:8px; background:var(--panel); color:var(--text2); padding:6px 12px; cursor:pointer}
.problemSteps button:hover:not(:disabled){border-color:var(--primary); color:var(--primary)}
.problemSteps button:disabled{opacity:.45; cursor:not-allowed}
.pgrid{display:grid; grid-template-columns:var(--sidebar-width,224px) minmax(340px,var(--statement-width,1fr)) 10px minmax(340px,1fr); gap:12px; align-items:start; min-width:0}
.pgrid.sidebarCollapsed{--sidebar-width:44px}
.pside{height:calc(100dvh - 92px); min-height:420px; position:sticky; top:72px; padding:0; display:flex; flex-direction:column; overflow:hidden}
.psideHead{display:flex; align-items:center; gap:8px; padding:10px 8px 10px 12px; border-bottom:1px solid var(--border2); min-height:48px}
.psideTitle{font-size:13px; font-weight:700; line-height:1.3; flex:1; min-width:0}
.psideToggle{border:1px solid var(--border); border-radius:7px; background:var(--panel); color:var(--text2); cursor:pointer; width:29px; height:29px; flex:0 0 29px; padding:0}
.psideToggle:hover{border-color:var(--primary); color:var(--primary)}
.psideBody{overflow:auto; padding:8px 10px 14px; min-height:0}
.psideGroup{margin-bottom:15px}
.psideGroupHead{font-size:11.5px; font-weight:700; color:var(--text2); line-height:1.4; margin:5px 0 7px}
.psideGroupHead span{font-weight:400; color:var(--muted); display:block}
.psideTiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(43px,1fr)); gap:6px}
.psideTile{min-height:39px; border:1px solid var(--border); border-radius:7px; background:var(--panel2); color:var(--text2); text-decoration:none; display:flex; align-items:center; justify-content:center; gap:2px; font:600 11.5px var(--mono)}
.psideTile:hover{text-decoration:none; border-color:var(--primary); color:var(--primary)}
.psideTile.solved{background:var(--okWeak); color:var(--ok); border-color:var(--ok)}
.psideTile.partial{background:var(--warnWeak); color:var(--warn); border-color:var(--warn)}
.psideTile.att{background:var(--errWeak); color:var(--err); border-color:var(--err)}
.psideTile.active{outline:2px solid var(--primary); outline-offset:1px}
.psideTile .tileMark{font-size:12px}
.psideFoot{margin-top:auto; padding:9px 7px; text-align:center; border-top:1px solid var(--border2); font-size:11px; color:var(--muted)}
.sidebarCollapsed .psideHead{padding:8px 6px}
.sidebarCollapsed .psideTitle,.sidebarCollapsed .psideBody,.sidebarCollapsed .psideFoot{display:none}
.pdivider{height:calc(100dvh - 92px); min-height:420px; position:sticky; top:72px; border-radius:8px; cursor:col-resize; touch-action:none; background:transparent; display:flex; align-items:center; justify-content:center}
.pdivider:before{content:''; width:4px; height:70px; border-radius:5px; background:var(--border)}
.pdivider:hover:before,.pdivider:focus-visible:before,.pdivider.dragging:before{background:var(--primary)}
.pdivider:focus-visible{outline:2px solid var(--primary)}
.pcard{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow)}
.pstmt{padding:20px 22px 26px; min-width:0}
.ptitle{font-size:19px; font-weight:700; line-height:1.4; margin:0 0 11px}
.chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px}
.mdsec{margin:0 0 18px}
.mdsec>h4{
  font-size:13px; font-weight:700; margin:0 0 8px; color:var(--text);
  padding-left:9px; border-left:3px solid var(--primary); line-height:1.2;
}
.md{font-size:13.8px; color:var(--text2); line-height:1.78}
.md p{margin:0 0 10px}
.md p:last-child{margin-bottom:0}
.md .md-h{font-size:14.5px; color:var(--text); margin:14px 0 8px; font-weight:700}
.md ul,.md ol{margin:0 0 10px; padding-left:22px}
.md li{margin:3px 0}
.md code{
  font-family:var(--mono); font-size:12.6px; background:var(--panel3); padding:1.5px 5px;
  border-radius:4px; color:#b3377a; border:1px solid var(--border2);
}
@media (prefers-color-scheme:dark){ .md code{color:#f78fb3} }
.md pre.code{
  font-family:var(--mono); font-size:12.6px; background:var(--panel2); border:1px solid var(--border);
  border-radius:8px; padding:12px 14px; overflow:auto; margin:0 0 12px; line-height:1.6; color:var(--text);
}
.md pre.code code{background:none; border:0; padding:0; color:inherit}
.md table.md-table{border-collapse:collapse; width:100%; margin:0 0 12px; font-size:13px}
.md table.md-table th,.md table.md-table td{border:1px solid var(--border); padding:6px 10px; text-align:left}
.md table.md-table th{background:var(--panel2); font-weight:600; color:var(--text)}
.md hr{border:0; border-top:1px solid var(--border); margin:14px 0}
.md blockquote.cal{
  margin:0 0 12px; padding:10px 14px; border-radius:8px; border:1px solid var(--border);
  background:var(--panel2); border-left:3px solid var(--muted);
}
.md blockquote.cal p:last-child{margin-bottom:0}
.md blockquote.cal .cal-t{font-weight:700; font-size:12.5px; margin-bottom:5px; color:var(--text)}
.md blockquote.cal-warning{border-left-color:var(--warn); background:var(--warnWeak)}
.md blockquote.cal-warning .cal-t{color:var(--warn)}
.md blockquote.cal-tip,.md blockquote.cal-info{border-left-color:var(--info); background:var(--infoWeak)}
.md blockquote.cal-tip .cal-t,.md blockquote.cal-info .cal-t{color:var(--info)}
.md blockquote.cal-success{border-left-color:var(--ok); background:var(--okWeak)}
.md blockquote.cal-success .cal-t{color:var(--ok)}
.md blockquote.cal-danger{border-left-color:var(--err); background:var(--errWeak)}
.md blockquote.cal-danger .cal-t{color:var(--err)}

.sample{border:1px solid var(--border); border-radius:9px; overflow:hidden; margin-bottom:11px}
.sampleHead{
  display:flex; align-items:center; gap:9px; padding:7px 12px; background:var(--panel2);
  font-size:12.5px; font-weight:600; color:var(--text2); border-bottom:1px solid var(--border2);
}
.sampleHead .cp{margin-left:auto; font-size:11.5px; color:var(--muted); cursor:pointer; border:1px solid var(--border); background:var(--panel); border-radius:6px; padding:1.5px 8px}
.sampleHead .cp:hover{color:var(--primary); border-color:var(--primary)}
/* 行内小按钮（登录名/密码那一行用） */
.miniBtn{font:inherit; font-size:11.5px; color:var(--muted); cursor:pointer; border:1px solid var(--border); background:var(--panel); border-radius:6px; padding:1px 8px; margin-left:6px; line-height:1.7}
.miniBtn:hover{color:var(--primary); border-color:var(--primary)}
.sampleBody{display:grid; grid-template-columns:1fr 1fr; gap:0}
.sampleBody>div{padding:9px 12px; min-width:0}
.sampleBody>div:first-child{border-right:1px solid var(--border2)}
.sampleBody .lb{font-size:11px; color:var(--muted); margin-bottom:4px; letter-spacing:.03em}
.sampleBody pre{
  margin:0; font-family:var(--mono); font-size:12.4px; white-space:pre-wrap; word-break:break-all;
  color:var(--text); line-height:1.6; max-height:230px; overflow:auto;
}
.sampleNote{padding:8px 12px; border-top:1px solid var(--border2); background:var(--panel2)}

.pedit{padding:0; display:flex; flex-direction:column; height:calc(100dvh - 92px); min-height:420px; position:sticky; top:72px; min-width:0}
.peditHead{
  display:flex; align-items:center; gap:9px; padding:12px 15px; border-bottom:1px solid var(--border2);
  flex-wrap:wrap;
}
.peditHead .tt{font-size:13.5px; font-weight:700}
.peditHead .grow{flex:1}
select.sel,input.inp{
  border:1px solid var(--border); background:var(--panel2); border-radius:7px; padding:5px 9px;
  font-size:12.8px; outline:0;
}
select.sel:focus,input.inp:focus{border-color:var(--primary)}
.peditBody{padding:14px 15px; overflow:auto; flex:1; min-height:0; display:flex; flex-direction:column; gap:11px}
.editor{
  width:100%; min-height:330px; resize:vertical; border:1px solid var(--border); border-radius:9px;
  background:var(--panel2); color:var(--text); font-family:var(--mono); font-size:15px;
  line-height:1.62; padding:12px 13px; outline:0; tab-size:4;
}
.pedit.hasCode .editor{flex:1 0 300px}
/* 命令题：只写一条命令，框压到两三行高，不占满整屏 */
.editor.cmdBox{
  min-height:64px; flex:0 0 auto; font-size:15.5px; letter-spacing:.2px;
  white-space:pre-wrap; word-break:break-all;
}
.editor.cmdBox::placeholder{color:var(--muted); opacity:.75}
.codeEditor{flex:1 0 300px; min-height:300px; border:1px solid var(--border); border-radius:9px; background:var(--panel2)}
.codeEditor:focus-within{border-color:var(--primary); background:var(--panel)}
.codeEditor .cm-editor{height:100%; min-height:300px; font:15px/1.62 var(--mono); color:var(--text); background:transparent}
.codeEditor .cm-scroller{font-family:var(--mono); overflow:auto}
.codeEditor .cm-gutters{background:var(--panel2); color:var(--muted); border-color:var(--border)}
.codeEditor .cm-content{padding:12px 8px; min-height:100%}
.codeEditor .cm-focused{outline:0}
.editorKeys{font-size:11.5px; color:var(--muted); line-height:1.4}
.pedit.hasCode #resultBox,.pedit.hasCode #histBox{flex:0 0 auto}
.editor:focus{border-color:var(--primary); background:var(--panel)}
.editor::placeholder{color:var(--muted)}
.btnrow{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.btn{
  border:0; border-radius:8px; padding:8px 17px; font-size:13.5px; font-weight:600; cursor:pointer;
  background:var(--primary); color:#fff; transition:.13s;
}
.btn:hover{background:var(--primary2)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.ghost{background:var(--panel); color:var(--text2); border:1px solid var(--border)}
.btn.ghost:hover{background:var(--panel3); color:var(--text)}
.btn.sm{padding:5px 12px; font-size:12.5px}
.hintline{font-size:12px; color:var(--muted)}
.stdinBox{width:100%; min-height:74px; resize:vertical; border:1px solid var(--border); border-radius:8px;
  background:var(--panel2); padding:9px 11px; font-family:var(--mono); font-size:12.6px; outline:0}
.stdinBox:focus{border-color:var(--primary)}
@media (max-width:1080px){
  #app.problemView{padding:14px 14px 45px}
  .pgrid{grid-template-columns:minmax(0,1fr); gap:12px}
  .pside{position:relative; top:auto; height:auto; min-height:0; max-height:300px}
  .psideBody{max-height:215px}
  .sidebarCollapsed .pside{max-height:none}
  .pdivider{display:none}
  .pedit{position:relative; top:auto; height:auto; min-height:500px}
  .pedit.hasCode .editor{min-height:380px}
  .codeEditor{min-height:380px}
}
@media (max-width:560px){
  .nav{gap:7px; padding:0 9px}
  .brand span:not(.logo){display:none}
  .brand .logo{flex:0 0 26px}
  .navlinks{margin-left:0; gap:0}
  .navlinks a{padding:6px 5px; font-size:11.5px}
  .navright{gap:5px; font-size:10.5px}
  .offlineTag{padding:2px 5px; font-size:10px}
  .iconbtn{padding:5px 7px; font-size:11px}
  .problemTop{align-items:flex-start; flex-direction:column}
  .problemSteps{width:100%}
  .problemSteps button{flex:1}
}

.choiceList{display:flex; flex-direction:column; gap:9px}
.choice{
  display:flex; align-items:flex-start; gap:11px; padding:11px 13px; border:1.5px solid var(--border);
  border-radius:10px; cursor:pointer; background:var(--panel); transition:.12s; font-size:13.6px;
}
.choice:hover{border-color:var(--primary); background:var(--panel2)}
.choice.on{border-color:var(--primary); background:var(--primaryWeak)}
.choice .mark{
  flex:0 0 22px; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--border);
  display:grid; place-items:center; font-size:12px; font-weight:700; color:var(--muted); background:var(--panel);
}
.choice.on .mark{background:var(--primary); border-color:var(--primary); color:#fff}
.choice .txt{flex:1; color:var(--text); line-height:1.55; padding-top:1px}

.verdict{display:flex; align-items:center; gap:11px; padding:13px 15px; border-radius:10px; font-weight:700; font-size:15px; border:1px solid var(--border)}
.v-AC{background:var(--okWeak); color:var(--ok); border-color:rgba(18,161,80,.3)}
.v-WA,.v-RE,.v-MLE,.v-TLE,.v-CE,.v-IE,.v-PE{background:var(--errWeak); color:var(--err); border-color:rgba(220,59,52,.28)}
.v-partial{background:var(--warnWeak); color:var(--warn); border-color:rgba(224,140,0,.3)}
.v-pending{background:var(--infoWeak); color:var(--info); border-color:rgba(13,143,217,.28)}
.verdict .spin{
  width:15px;height:15px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.resMeta{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-top:9px}
.resMeta b{color:var(--text); font-variant-numeric:tabular-nums}
.caseRow{border:1px solid var(--border); border-radius:8px; margin-top:8px; overflow:hidden; font-size:13px}
.caseHead{display:flex; align-items:center; gap:9px; padding:8px 12px; background:var(--panel2); cursor:pointer}
.caseHead:hover{background:var(--panel3)}
.caseHead .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.dot.d-AC{background:var(--ok)} .dot.d-WA{background:var(--err)} .dot.d-TLE{background:var(--warn)}
.dot.d-MLE{background:var(--purple)} .dot.d-RE{background:var(--err)} .dot.d-CE{background:var(--muted)}
.dot.d-IE{background:var(--muted)} .dot.d-PE{background:var(--warn)} .dot.d-OK{background:var(--ok)}
.caseHead .nm{font-weight:600}
.caseHead .grow{flex:1}
.caseHead .pts{color:var(--muted); font-size:12px}
.caseHead .ms{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}
.caseBody{padding:11px 13px; border-top:1px solid var(--border2); background:var(--panel); display:flex; flex-direction:column; gap:9px}
.ioRow .lb{font-size:11.5px; color:var(--muted); margin-bottom:3px}
.ioRow pre{
  margin:0; font-family:var(--mono); font-size:12.3px; background:var(--panel2); border:1px solid var(--border2);
  border-radius:7px; padding:8px 10px; white-space:pre-wrap; word-break:break-all; max-height:190px; overflow:auto;
}
.err{color:var(--err)}
.histRow{
  display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dashed var(--border2);
  font-size:12.6px; color:var(--text2);
}
.histRow:last-child{border-bottom:0}
.vt{font-weight:700; font-size:12px; padding:1px 7px; border-radius:5px}
.vt-AC{background:var(--okWeak); color:var(--ok)} .vt-other{background:var(--errWeak); color:var(--err)}
.vt-pending{background:var(--infoWeak); color:var(--info)}
.histRow .tm{margin-left:auto; color:var(--muted); font-size:11.5px}

.banner{
  display:flex; align-items:center; gap:10px; padding:11px 15px; border-radius:10px; margin-bottom:15px;
  font-size:13px; background:var(--infoWeak); color:var(--info); border:1px solid rgba(13,143,217,.25);
}
.banner.warn{background:var(--warnWeak); color:var(--warn); border-color:rgba(224,140,0,.28)}
.banner .grow{flex:1}

/* ---------- 弹层 ---------- */
.mask{
  position:fixed; inset:0; background:rgba(12,20,34,.5); z-index:100; display:flex;
  align-items:center; justify-content:center; padding:22px; backdrop-filter:blur(2px);
}
.modal{
  background:var(--panel); border-radius:14px; box-shadow:var(--shadow2); width:100%; max-width:520px;
  max-height:86vh; overflow:auto; border:1px solid var(--border);
}
.modalHead{display:flex; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border2); font-size:15px; font-weight:700}
.modalHead .x{margin-left:auto; cursor:pointer; color:var(--muted); font-size:19px; line-height:1; border:0; background:none}
.modalHead .x:hover{color:var(--text)}
.modalBody{padding:18px 20px 22px; display:flex; flex-direction:column; gap:15px}
.field .lb{font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--text2)}
.field .desc{font-size:11.8px; color:var(--muted); margin-top:5px; line-height:1.6}
.field input{width:100%; border:1px solid var(--border); background:var(--panel2); border-radius:8px; padding:8px 11px; font-size:13px; outline:0}
.field input:focus{border-color:var(--primary)}
.codeInline{font-family:var(--mono); font-size:12.2px; background:var(--panel3); padding:2px 6px; border-radius:5px; word-break:break-all}

#toast{position:fixed; left:50%; bottom:34px; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{
  background:var(--text); color:var(--bg); border-radius:9px; padding:9px 17px; font-size:13px;
  box-shadow:var(--shadow2); animation:pop .22s ease; max-width:70vw;
}
.toast.err{background:var(--err); color:#fff}
.toast.ok{background:var(--ok); color:#fff}
@keyframes pop{from{opacity:0; transform:translateY(9px)}to{opacity:1; transform:none}}
.loading{text-align:center; padding:60px 20px; color:var(--muted); font-size:13.5px}

/* ---------- 笔记区（#/notes） ----------
   配色全部走 :root 里的变量，所以深色模式自动跟着变。
   代码高亮是 highlight.js 的 token 类名，颜色在本块末尾统一给。 */
#app.notesView{max-width:1520px; margin:0 auto; padding:20px 22px 70px}
.notesView{ --codeBg:var(--panel3); --codeFg:var(--text);
  --hl-key:#a626a4; --hl-str:#50a14f; --hl-com:#a0a1a7; --hl-num:#986801;
  --hl-fn:#4078f2; --hl-bi:#c18401; --hl-var:#e45649; --hl-attr:#986801; }

/* 首页 */
.notesHero{
  display:flex; gap:24px; align-items:center; flex-wrap:wrap; padding:22px 24px; margin-bottom:22px;
  border-radius:16px; color:#fff; box-shadow:var(--shadow2);
  background:linear-gradient(120deg,#2f6bed 0%,#4a54e0 55%,#7b5cf0 100%);
}
.notesHeroL{flex:1 1 300px; min-width:240px}
.notesHeroT{font-size:20px; font-weight:700; margin-bottom:5px}
.notesHeroS{font-size:13px; color:rgba(255,255,255,.85); line-height:1.7}
.notesHeroR{flex:0 0 420px; min-width:260px}
.notesLines{display:flex; flex-direction:column; gap:16px}
.noteLineCard{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px 15px; box-shadow:var(--shadow);
}
.noteLineHead{display:flex; align-items:baseline; gap:10px; margin-bottom:12px}
.noteLineName{font-size:15px; font-weight:700}
.noteLineHead .cnt{font-size:12px; color:var(--muted)}
.noteLecGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:8px}
.noteLec{
  display:flex; align-items:center; gap:8px; padding:9px 11px; border-radius:var(--radius2);
  background:var(--panel2); border:1px solid var(--border2); color:inherit; font-size:13px;
}
.noteLec:hover{border-color:var(--primary); background:var(--primaryWeak); text-decoration:none}
.noteLec b{color:var(--primary); font-variant-numeric:tabular-nums; font-size:13.5px}
.noteLecT{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.noteLecC{font-size:11.5px; color:var(--muted); white-space:nowrap}
.noteExtras{display:flex; flex-wrap:wrap; gap:8px; margin-top:11px; padding-top:11px; border-top:1px dashed var(--border)}
.noteExtras a{
  font-size:12.5px; padding:5px 11px; border-radius:20px; background:var(--panel3);
  border:1px solid var(--border2); color:var(--text2);
}
.noteExtras a:hover{border-color:var(--primary); color:var(--primary); text-decoration:none}

/* 搜索 */
.noteSearch{position:relative}
.noteSearch input{
  width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border);
  background:var(--panel); font-size:13.5px; outline:none;
}
.notesHeroR .noteSearch input{border-color:transparent; box-shadow:0 2px 10px rgba(0,0,0,.12)}
.noteSearch input:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primaryWeak)}
.noteSearchOut{
  display:none; position:absolute; z-index:40; top:calc(100% + 6px); left:0; right:0;
  max-height:60vh; overflow:auto; background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow2); padding:6px;
}
.nsHint,.nsCnt{padding:8px 10px; font-size:12.5px; color:var(--muted)}
.nsItem{display:block; padding:9px 11px; border-radius:var(--radius2); color:inherit}
.nsItem:hover{background:var(--panel2); text-decoration:none}
.nsTitle{font-weight:600; font-size:13.5px; margin-bottom:2px}
.nsCrumb{font-size:11.5px; color:var(--muted); margin-bottom:3px}
.nsSnip{font-size:12.5px; color:var(--text2); line-height:1.6}
.nsSnip mark,.nsTitle mark{background:var(--warnWeak); color:inherit; padding:0 2px; border-radius:3px}

/* 单篇布局 */
.noteLayout{display:grid; grid-template-columns:250px minmax(0,1fr); gap:22px; align-items:start}
.noteSide{position:sticky; top:72px; max-height:calc(100vh - 92px); overflow:auto;
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:12px}
.noteTreeHead{display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  padding:2px 4px 9px; margin-bottom:8px; border-bottom:1px solid var(--border2); font-size:12.5px}
.noteTreeHead .back{color:var(--text2)}
.noteTreeHead .cnt{color:var(--muted)}
.treeLec{margin-bottom:2px}
.treeLec>summary{
  cursor:pointer; list-style:none; padding:6px 8px; border-radius:var(--radius2);
  font-size:13px; display:flex; gap:7px; align-items:baseline;
}
.treeLec>summary::-webkit-details-marker{display:none}
.treeLec>summary:hover{background:var(--panel3)}
.treeLec>summary b{color:var(--primary); font-variant-numeric:tabular-nums; flex:0 0 auto}
.treeLec[open]>summary{background:var(--panel3); font-weight:600}
.treePages{display:flex; flex-direction:column; padding:2px 0 6px 10px; border-left:2px solid var(--border2); margin-left:9px}
.treePages a{
  padding:5px 8px; border-radius:6px; font-size:12.5px; color:var(--text2); line-height:1.5;
}
.treePages a:hover{background:var(--panel2); color:var(--text); text-decoration:none}
.treePages a.on{background:var(--primaryWeak); color:var(--primary); font-weight:600}
.treeExtra{display:flex; flex-direction:column; gap:2px; margin-top:9px; padding-top:9px; border-top:1px dashed var(--border)}
.treeExtra a{padding:6px 8px; border-radius:6px; font-size:12.5px; color:var(--text2)}
.treeExtra a.on{background:var(--primaryWeak); color:var(--primary); font-weight:600}

.noteMain{min-width:0}
.noteTitle{font-size:22px; font-weight:700; margin:2px 0 12px; line-height:1.4}
.noteMeta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px}
.fmTag{font-size:11.5px; color:var(--text2); background:var(--panel3); border:1px solid var(--border2);
  padding:3px 9px; border-radius:20px}
.notePbar{
  font-size:13px; padding:10px 14px; margin-bottom:16px; border-radius:var(--radius2);
  background:var(--primaryWeak); border:1px solid rgba(47,107,237,.2); color:var(--text2);
}
.notePbar b{color:var(--primary)}
.notePager{display:flex; justify-content:space-between; gap:14px; margin-top:34px; padding-top:18px;
  border-top:1px solid var(--border); font-size:13.5px}
.notePager a{max-width:48%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.anchorFlash{animation:anchorFlash 1.6s ease}
@keyframes anchorFlash{0%,55%{background:var(--warnWeak); box-shadow:0 0 0 6px var(--warnWeak)}100%{background:transparent; box-shadow:none}}

/* 正文排版 */
.noteBody{font-size:14.5px; line-height:1.85; color:var(--text); word-wrap:break-word}
.noteBody h1,.noteBody h2,.noteBody h3,.noteBody h4,.noteBody h5,.noteBody h6{
  line-height:1.4; margin:1.6em 0 .6em; scroll-margin-top:76px; font-weight:700;
}
.noteBody h1{font-size:21px}
.noteBody h2{font-size:19.5px; padding-bottom:7px; border-bottom:1px solid var(--border)}
.noteBody h3{font-size:16.5px}
.noteBody h4{font-size:15px; color:var(--text2)}
.noteBody h5,.noteBody h6{font-size:14px; color:var(--text2)}
.noteBody p{margin:.75em 0}
.noteBody ul,.noteBody ol{margin:.7em 0; padding-left:1.6em}
.noteBody li{margin:.28em 0}
.noteBody li>ul,.noteBody li>ol{margin:.25em 0}
.noteBody blockquote{
  margin:.9em 0; padding:6px 14px; border-left:3px solid var(--border);
  background:var(--panel2); color:var(--text2); border-radius:0 var(--radius2) var(--radius2) 0;
}
.noteBody hr{border:0; border-top:1px solid var(--border); margin:1.7em 0}
.noteBody a{border-bottom:1px solid rgba(47,107,237,.35)}
.noteBody a:hover{text-decoration:none; border-bottom-color:var(--primary)}
.noteBody mark{background:var(--warnWeak); color:inherit; padding:0 3px; border-radius:3px}
.noteBody img{max-width:100%; border-radius:var(--radius2); border:1px solid var(--border)}
.noteBody pre.code-block{
  background:var(--codeBg); border:1px solid var(--border); border-radius:var(--radius2);
  padding:12px 14px; overflow:auto; margin:1em 0; font-size:13px; line-height:1.65;
}
.noteBody pre.code-block code{font-family:var(--mono); background:none; padding:0; border:0; color:var(--codeFg)}
.noteBody code{font-family:var(--mono); font-size:12.8px; background:var(--panel3);
  padding:1.5px 5px; border-radius:5px; border:1px solid var(--border2)}
.noteBody table{border-collapse:collapse; margin:1em 0; font-size:13px; display:block; overflow-x:auto; max-width:100%}
.noteBody th,.noteBody td{border:1px solid var(--border); padding:7px 11px; text-align:left; vertical-align:top}
.noteBody th{background:var(--panel3); font-weight:600}
.noteBody tbody tr:nth-child(even){background:var(--panel2)}
.noteBody input[type=checkbox]{margin-right:5px}

/* callout（笔记里 2210 个，折叠的那 1200 个是「答案收起」） */
.noteBody .callout{
  margin:1.05em 0; border-radius:var(--radius2); border:1px solid var(--border);
  border-left-width:3px; background:var(--panel2); overflow:hidden;
}
.noteBody .callout-title{
  font-weight:600; font-size:13.5px; padding:9px 14px; display:flex; align-items:center; gap:7px;
}
.noteBody .callout-body{padding:2px 14px 10px; font-size:14px}
.noteBody .callout-body> :first-child{margin-top:.4em}
.noteBody .callout-body> :last-child{margin-bottom:.2em}
.noteBody details.callout>summary{cursor:pointer; list-style:none; user-select:none}
.noteBody details.callout>summary::-webkit-details-marker{display:none}

<!-- 浏览器端理论题判题器：零后端、零下载。判题口径与后端 app/judge 逐条对拍过
     （题库全部理论题 × 多种答案 = 3463 条，逐字段一致）。
     ★ 要改它之前先跑 `node tools/verify_text_judge.mjs` 对拍。 -->
<script src="judge_text.js"></script>
<script src="python-local.js"></script>
<script src="cpp-local.js"></script>
<script>
let smartEditor = null;
let smartEditorProblemId = null;
let smartEditorLoad = null;
let smartEditorTry = 0;
function codeValue(){
  if (smartEditor && CUR && smartEditorProblemId === CUR.id) return smartEditor.getValue();
  const box = document.getElementById('codeBox');
  return box ? box.value : '';
}
async function initSmartEditor(problemId){
  const host = document.getElementById('codeEditor');
  const fallback = document.getElementById('codeBox');
  if (!host || !fallback) return;
  try {
    /* ★★ 两个「失败被缓存」叠在一起，必须一起处理：
       ① 我们自己把这个 import() 的 promise 缓存了 —— 它一旦 rejected，
          之后每次 await 都立刻失败，等于「一次没加载上，终生用回退」；
       ② 浏览器对**加载失败的动态 import** 也会按 URL 记住结果，
          光把变量清空、再 import 同一个地址，它连请求都不发。
       所以失败时既清缓存，也换个 URL 再试（?retry=N）。成功后就固定在没后缀的那个。 */
    if (!smartEditorLoad) {
      const url = './editor/editor.js' + (smartEditorTry ? '?retry=' + smartEditorTry : '');
      smartEditorLoad = import(url).catch(err => { smartEditorLoad = null; smartEditorTry++; throw err; });
    }
    const { mountEditor } = await smartEditorLoad;
    if (!CUR || CUR.id !== problemId || !host.isConnected) return;
    const lang = document.getElementById('langSel')?.value || 'python';
    const editor = mountEditor({ parent: host, doc: fallback.value, lang, onChange(value){
      fallback.value = value;
      if (CUR && CUR.id === problemId) onCodeInput();
    }});
    smartEditor = editor;
    smartEditorProblemId = problemId;
    fallback.style.display = 'none';
    host.hidden = false;
  } catch (e) {
    console.warn('CodeMirror failed; using textarea', e);
    host.hidden = true;
    fallback.style.display = '';
    toast('智能编辑器没能加载，已回退到简易输入框（功能不受影响）');
  }
}
"use strict";

/* =========================================================================
   0. 常量与小工具
   ========================================================================= */
const LS = {
  token:  'pta.userToken',
  api:    'pta.apiBase',
  nick:   'pta.nickname',
  draft:  p => 'pta.draft.' + p,
  local:  'pta.localProgress',
  seen:   'pta.lastProblem',
  sort:   'pta.sortMode',
  /* 收藏 / 掌握度 / 备注的本地副本。★ 后端 mastery 表是权威，但写操作永远
     **先落本地**：静态站（GitHub Pages）根本没有后端，离线也得能收藏、能写备注。
     后端连上时再异步同步过去，同步失败只提示、不回滚 —— 用户刚写的东西不能消失。 */
  mastery:'pta.mastery',
  wbFilter: 'pta.wbFilter',
  wbSubject:'pta.wbSubject',
  problemSidebar: 'pta.problemSidebarCollapsed',
  problemSplit: 'pta.problemSplitRatio',
  /* Linux 线的题面里会出现「你的家目录」这种因人而异的东西。题库里统一写成
     占位符 `{user}`（例：`/home/{user}/docs`），渲染时才换成这个人自己的登录名。 */
  linuxUser: 'pta.linuxUser',
  /* 装机时设的那个登录密码。做用户管理 / su / sudo 那些题时手边能查一眼。
     ★ 只存在这台机器的浏览器里，任何提交、导出、日志都不带它。 */
  linuxPass: 'pta.linuxPass',
};

const VERDICT_TXT = {
  AC:'答案正确', WA:'答案错误', TLE:'运行超时', MLE:'内存超限',
  RE:'运行时错误', CE:'编译错误', PE:'格式错误', IE:'评测机内部错误',
  OK:'运行成功', pending:'等待评测', judging:'正在评测…',
};
const SUBJECT_ICON = { python:'PY', ds:'DS', linux:'LX' };

let TOKEN = '';
let OFFLINE = false;          // 后端连不上 → 只浏览 + 本地标记
let META = null;              // /api/meta
let CATALOG = null;           // 归一化后的科目目录
let PROBLEMS = [];            // 题目列表（带我的进度）
let SET = {};                 // hash 路由解析结果

/* =========================================================================
   1. 身份与后端地址
   ========================================================================= */
function ensureToken(){
  let t = '';
  try { t = localStorage.getItem(LS.token) || ''; } catch(e){}
  if (/^[0-9a-f]{16,64}$/.test(t)) return t;
  const a = new Uint8Array(16);
  (window.crypto || window.msCrypto).getRandomValues(a);
  t = Array.from(a).map(x => x.toString(16).padStart(2,'0')).join('');
  try { localStorage.setItem(LS.token, t); } catch(e){}
  return t;
}

function apiBase(){
  const q = new URLSearchParams(location.search).get('api');
  if (q !== null && q !== '') { try{ localStorage.setItem(LS.api, q.replace(/\/+$/,'')); }catch(e){} }
  let v = '';
  try { v = localStorage.getItem(LS.api) || ''; } catch(e){}
  if (v) return v.replace(/\/+$/,'');
  if (location.protocol === 'file:') return '';
  return location.origin;
}

async function api(path, opts){
  const base = apiBase();
  if (!base) throw new Error('NO_BACKEND');
  const o = Object.assign({}, opts || {});
  o.headers = Object.assign({'X-User-Token': TOKEN}, o.headers || {});
  if (o.body && typeof o.body !== 'string'){ o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(o.body); }
  const res = await fetch(base + path, o);
  if (!res.ok){
    let d = '';
    try { const j = await res.json(); d = j.detail || ''; } catch(e){}
    throw new Error(d || ('HTTP ' + res.status));
  }
  return res.json();
}

/* =========================================================================
   2. 本地进度（离线时的「手动标记」）
   ========================================================================= */
function localProgress(){
  try { return JSON.parse(localStorage.getItem(LS.local) || '{}') || {}; } catch(e){ return {}; }
}
/* 记录一次作答结果。
   ★ 默认保留**历史最高分**：本地判题会反复调用它，如果直接覆盖，
     答对之后再交一次错的就会把「已掌握」冲掉（后端口径同样是取最高分）。
     手动标记里的「部分掌握」要的就是「改成这个值」，所以给它 {force:true}。 */
function setLocalProgress(pid, best, total, opts){
  const m = localProgress();
  const prev = m[pid] || {};
  const v = parseInt(best || 0, 10) || 0;
  const t = parseInt(total || 0, 10) || 0;
  const keep = (opts && opts.force) ? v : Math.max(parseInt(prev.best_score || 0, 10) || 0, v);
  m[pid] = { best_score: keep, total_score: t,
             attempts: (parseInt(prev.attempts || 0, 10) || 0) + 1,
             solved_at: (t > 0 && keep >= t) ? (prev.solved_at || nowStamp()) : '' };
  try { localStorage.setItem(LS.local, JSON.stringify(m)); } catch(e){}
}
function nowStamp(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}

/* =========================================================================
   2.5 收藏 / 掌握度 / 备注（个人标注）

   ★ 存储策略：**本地优先，后端兜底**
     静态站（GitHub Pages）根本没有后端，离线也必须能收藏、能写备注；
     而本地 localStorage 又是「换浏览器就没了」的。
     所以两边都写：本地立刻生效（UI 不等待），后端连上时异步同步。
     写失败**不回滚**本地 —— 用户刚敲的那段字不能因为网络抖一下就没。

   ★ 与「进度」的区别：进度是判题算出来的，这里的三样是**人写的**。
     收藏不增加 attempts（见 app/api/mastery.py 的 _ensure_row 注释）。
   ========================================================================= */
const NOTE_MAX = 2000;              // 与 app/api/mastery.py 的 NOTE_MAX 对齐
const LEVEL_TXT = ['未评估', '需复习', '熟练'];

function masteryAll(){
  try { return JSON.parse(localStorage.getItem(LS.mastery) || '{}') || {}; } catch(e){ return {}; }
}
function masteryOf(pid){
  const m = masteryAll()[String(pid)];
  return (m && typeof m === 'object') ? m : {};
}
function _masteryWrite(all){
  try { localStorage.setItem(LS.mastery, JSON.stringify(all)); } catch(e){}
}
/* 整行替换（校验失败时回滚用） */
function _setMasteryRaw(pid, obj){
  const all = masteryAll();
  if (obj) all[String(pid)] = obj; else delete all[String(pid)];
  _masteryWrite(all);
  const p = (PROBLEMS || []).find(x => x.id === pid);
  if (p) Object.assign(p, { is_starred: obj ? (obj.is_starred ? 1 : 0) : 0 });
  if (CUR && CUR.id === pid){
    Object.assign(CUR, { is_starred: obj ? (obj.is_starred ? 1 : 0) : 0 });
    if (CUR.mastery) Object.assign(CUR.mastery, obj || {});
  }
}
/* 合并写入本地缓存，并同步内存里的题目对象（列表星标、题面按钮靠它） */
function applyMasteryLocal(pid, patch){
  const all = masteryAll();
  const k = String(pid);
  const cur = (all[k] && typeof all[k] === 'object') ? all[k] : {};
  all[k] = Object.assign({}, cur, patch);
  _masteryWrite(all);
  const p = (PROBLEMS || []).find(x => x.id === pid);
  if (p) Object.assign(p, patch);
  if (CUR && CUR.id === pid){
    Object.assign(CUR, patch);
    if (CUR.mastery && typeof CUR.mastery === 'object') Object.assign(CUR.mastery, patch);
  }
  return all[k];
}

/* 保存一处标注。返回后端给的 item；离线或纯网络失败时返回本地对象，校验失败返回 null。 */
const masterySaveQueues = new Map();
async function saveMastery(pid, patch){
  const body = Object.assign({}, patch);
  if ('note' in body){
    body.note = String(body.note == null ? '' : body.note).replace(/\r\n?/g, '\n').trim();
    if (body.note.length > NOTE_MAX){
      toast('备注最多 ' + NOTE_MAX + ' 字（现在 ' + body.note.length + ' 字）', 'err');
      return null;
    }
  }
  if ('level' in body && [0,1,2].indexOf(parseInt(body.level, 10)) < 0){
    toast('掌握度只能是 0/1/2', 'err');
    return null;
  }
  if ('is_starred' in body) body.is_starred = body.is_starred ? 1 : 0;

  const prev = Object.assign({}, masteryOf(pid));   // 400 时回滚用
  const revision = Date.now() + '-' + Math.random();
  applyMasteryLocal(pid, {...body, _dirty:true, _revision:revision});
  MASTERY_SYNCED = false;
  updateMasterySyncStatus();
  if (OFFLINE) return body;

  const previousRequest = masterySaveQueues.get(pid) || Promise.resolve();
  const request = previousRequest.catch(() => {}).then(async () => {
  if (masteryOf(pid)._revision !== revision) return masteryOf(pid);
  try {
    const pending = masteryOf(pid);
    const payload = {note:pending.note || '', level:pending.level || 0, is_starred:pending.is_starred ? 1 : 0};
    const r = await api('/api/mastery/' + pid, { method:'PATCH', body:payload });
    if (masteryOf(pid)._revision !== revision) return masteryOf(pid);
    const it = r && r.item;
    applyMasteryLocal(pid, {...(it ? {is_starred:it.is_starred,level:it.level,note:it.note} : {}), _dirty:false});
    updateMasterySyncStatus();
    return it || body;
  } catch(e){
    if (masteryOf(pid)._revision !== revision) return masteryOf(pid);
    const msg = String((e && e.message) || e);
    if (/^(HTTP )?4\d\d/.test(msg)){
      /* 后端明确不认（参数越界/题目不存在）→ 把本地改回去，别留个假状态 */
      _setMasteryRaw(pid, Object.keys(prev).length ? prev : null);
      updateMasterySyncStatus();
      toast('没保存上：' + msg, 'err');
      return null;
    }
    toast('已存在本地，后端暂时没同步上', 'err');
    return body;
  }
  });
  masterySaveQueues.set(pid, request);
  try { return await request; }
  finally { if (masterySaveQueues.get(pid) === request) masterySaveQueues.delete(pid); }
}

/* 页面上「这颗星亮不亮」的唯一判据：本地缓存优先，其次用接口给的字段 */
function isStarred(p){
  const pid = (p && typeof p === 'object') ? p.id : p;
  const m = masteryOf(pid);
  if ('is_starred' in m) return !!m.is_starred;
  return !!(p && typeof p === 'object' && p.is_starred);
}
function levelOf(pid){
  const m = masteryOf(pid);
  if ('level' in m) return parseInt(m.level, 10) || 0;
  return 0;
}
function noteOf(pid){
  const m = masteryOf(pid);
  return typeof m.note === 'string' ? m.note : '';
}
/* 点星星：本地立刻翻面，再异步同步（失败会 toast，但星星不弹回去） */
async function toggleStar(pid, ev){
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  const next = isStarred(pid) ? 0 : 1;
  applyMasteryLocal(pid, { is_starred: next });
  renderStarsFor(pid);
  const r = await saveMastery(pid, { is_starred: next });
  if (r === null) renderStarsFor(pid);            // 被后端驳回 → 按真实状态重画
  else if (SET.view === 'wrongbook') viewWrongbook({ keepScroll: true });
}
/* 一页上同一道题可能出现在多处（列表 / 题面 / 错题本），全部就地翻面 */
function renderStarsFor(pid){
  const on = isStarred(pid);
  document.querySelectorAll('[data-star="' + pid + '"]').forEach(el => {
    el.classList.toggle('on', on);
    if (el.classList.contains('wbStarSm')) el.textContent = on ? '★' : '☆';
    else if (el.classList.contains('wbItemStar')) el.textContent = on ? '★' : '☆';
    el.title = on ? '取消收藏' : '收藏';
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const big = document.getElementById('pStarBtn');
  if (big && CUR && CUR.id === pid){
    big.classList.toggle('on', on);
    big.textContent = on ? '★ 已收藏' : '☆ 收藏';
    big.title = on ? '取消收藏' : '收藏这道题';

/* 首屏从后端拉一次标注，补齐「换了浏览器/清了缓存」的那一半。
   服务端是权威，但本地独有的键保留（可能是刚写还没推上去的）。 */
let MASTERY_SYNCED = false;
function updateMasterySyncStatus(){
  let badge=document.getElementById('masterySyncStatus');
  if (!badge) { badge=document.createElement('span'); badge.id='masterySyncStatus'; badge.className='hintline'; document.querySelector('.navright')?.prepend(badge); }
  const all=masteryAll(), pending=Object.values(all).filter(x=>x && x._dirty).length;
  badge.textContent=pending ? (OFFLINE ? '标注仅存本机' : '标注待同步 '+pending) : (Object.keys(all).length && !OFFLINE ? '标注已同步' : '');
}
async function syncMasteryFromServer(){
  if (MASTERY_SYNCED || OFFLINE) { updateMasterySyncStatus(); return; }
  try {
    const r=await api('/api/mastery');
    for(const it of r.items || []) {
      const pid=Number(it.id), current=masteryOf(pid);
      if (current._dirty || (Object.keys(current).length && current._dirty === undefined)) {
        const conflict=current.note && it.note && current.note !== it.note ? it.note : current._remoteNote;
        applyMasteryLocal(pid,{_dirty:true,...(conflict ? {_remoteNote:conflict} : {})});
      } else applyMasteryLocal(pid,{is_starred:it.is_starred,level:it.level,note:it.note,_dirty:false});
    }
    for (const [pid,item] of Object.entries(masteryAll())) {
      if (item._dirty) await saveMastery(Number(pid),{note:item.note || '',level:item.level || 0,is_starred:item.is_starred ? 1 : 0});
    }
    MASTERY_SYNCED=!Object.values(masteryAll()).some(x=>x && x._dirty);
  } catch(e) { /* Keep local edits pending when the backend is unavailable. */ }
  updateMasterySyncStatus();
}

/* =========================================================================
   3. Markdown 渲染（离线也能用，不依赖任何 CDN）
   ========================================================================= */
function esc(s){
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s){ return esc(s).replace(/'/g,'&#39;'); }

function mdInline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return s;
}

const CAL_TITLE = { warning:'注意', note:'说明', tip:'提示', success:'答案', danger:'警告', info:'说明', question:'思考' };
const CAL_CLASS = { warning:'cal-warning', danger:'cal-danger', tip:'cal-tip', info:'cal-info',
                    success:'cal-success', note:'cal-note', question:'cal-info' };

/* ── Linux 登录名 ─────────────────────────────────────────────────────
   Linux 线的题面与解析里会出现「你的家目录」（`/home/<谁>/docs`）这种因人而异
   的东西。题库里一律写成占位符 `{user}`，渲染的时候才替换 —— 所以每个人
   看到的都是自己的名字，而不是写死作者一个人的。

   ★ 判题完全不受影响，也不需要在提交里带名字：
     题库的答案只认 `~/docs` 这种写法，而 `app/judge/compare.py` 的
     `_norm_home()` 会把 `/home/<任意登录名>/…` 折成 `~/…` 再比。
     换句话说：题面显示谁的名字，就照着写谁的绝对路径，一样判得过。
   ──────────────────────────────────────────────────────────────────── */
function linuxUser(){
  try { return String(localStorage.getItem(LS.linuxUser) || '').trim(); } catch(e){ return ''; }
}
/* 登录密码：只在浏览器本地存一份，用于做用户管理 / su / sudo 那几题时查一眼。
   不参与判题、不进提交、不进导出。 */
function linuxPass(){
  try { return String(localStorage.getItem(LS.linuxPass) || ''); } catch(e){ return ''; }
}
function passMask(){
  const p = linuxPass();
  return p ? '●'.repeat(Math.min(Math.max(p.length, 4), 10)) : '';
}
function saveLinuxUser(v, pass){
  /* 顺手容忍两种手滑：粘贴了 `~/zhangsan`、把整条 `whoami` 结果粘进来 */
  const name = String(v === undefined || v === null ? '' : v).trim()
    .replace(/^~\//, '').replace(/^\/home\//, '').replace(/\/$/, '');
  if (!name){ toast('先写个名字再点「记住」', 'err'); return; }
  if (/[\s/]/.test(name)){ toast('登录名里不会有空格或斜杠，检查一下', 'err'); return; }
  try { localStorage.setItem(LS.linuxUser, name); } catch(e){}
  if (pass !== undefined && pass !== null && String(pass) !== ''){
    try { localStorage.setItem(LS.linuxPass, String(pass)); } catch(e){}
  }
  toast('已记住：' + name + (linuxPass() ? '（密码只存在这台浏览器里）' : ''), 'ok');
  renderProblem();
}
function clearLinuxUser(){
  try {
    localStorage.removeItem(LS.linuxUser);
    localStorage.removeItem(LS.linuxPass);
  } catch(e){}
  renderProblem();
}
/* 密码默认打码，点「显示」才露出来 —— 屏幕上一个常驻的明文密码没什么必要 */
function toggleLinuxPass(btn){
  const box = document.getElementById('linuxPassVal');

}
function setLinuxPass(){
  const v = prompt('设置 / 修改你的 Linux 登录密码。\n\n'
    + '只存在这台机器的浏览器里，不上传、不进提交、不进导出。\n'
    + '留空并确定 = 清除已存的密码。', '');

function subUser(s){
  if (s === undefined || s === null) return s;
  const t = String(s);
  if (t.indexOf('{user}') < 0) return t;
  return t.split('{user}').join(linuxUser() || '你的登录名');
}

function mdRender(md){
  if (!md) return '';
  md = subUser(md);
  const lines = String(md).replace(/\r\n?/g,'\n').split('\n');
  const out = [];
  let para = [], i = 0, list = '';

  const flushP = () => { if (para.length){ out.push('<p>' + mdInline(para.join(' ')) + '</p>'); para = []; } };
  const flushL = () => { if (list){ out.push(list === 'ul' ? '</ul>' : '</ol>'); list = ''; } };
  const flushAll = () => { flushP(); flushL(); };

  while (i < lines.length){
    const L = lines[i];

    /* 围栏代码块 */
    let m = /^\s*```\s*([\w+#-]*)\s*$/.exec(L);
    if (m){
      flushAll();
      const buf = []; i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out.push('<pre class="code"><code>' + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }

    /* 空行 */
    if (/^\s*$/.test(L)) { flushAll(); i++; continue; }

    /* 标题 */
    m = /^(#{1,6})\s+(.*)$/.exec(L);
    if (m){ flushAll(); const lv = Math.min(6, m[1].length + 2);
      out.push('<div class="md-h">' + mdInline(m[2]) + '</div>'); i++; continue; }

    /* 分隔线 */
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(L)){ flushAll(); out.push('<hr>'); i++; continue; }

    /* 表格：| a | b |  下一行是 |---|---| */
    if (/^\s*\|/.test(L) && i + 1 < lines.length && /^\s*\|?[\s:|-]*-{2,}[\s:|-]*\|?\s*$/.test(lines[i+1])){
      flushAll();
      const cut = r => r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x => x.trim());
      const head = cut(L); i += 2; const body = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])){ body.push(cut(lines[i])); i++; }
      out.push('<table class="md-table"><thead><tr>'
        + head.map(h => '<th>' + mdInline(h) + '</th>').join('') + '</tr></thead><tbody>'
        + body.map(r => '<tr>' + r.map(c => '<td>' + mdInline(c) + '</td>').join('') + '</tr>').join('')
        + '</tbody></table>');
      continue;
    }

    /* 引用块 / Obsidian 折叠提示 */
    if (/^\s*>/.test(L)){
      flushAll();
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      let cls = 'cal-note', title = '';
      const cm = /^\[!(\w+)\]\s*[-+]?\s*(.*)$/.exec(buf[0] || '');
      if (cm){
        const kind = cm[1].toLowerCase();
        cls = CAL_CLASS[kind] || 'cal-note';
        title = cm[2] || CAL_TITLE[kind] || '';
        buf.shift();
      }
      out.push('<blockquote class="cal ' + cls + '">'
        + (title ? '<div class="cal-t">' + mdInline(title) + '</div>' : '')
        + mdRender(buf.join('\n')) + '</blockquote>');
      continue;
    }

    /* 无序列表 */
    m = /^\s*[-*+]\s+(.*)$/.exec(L);
    if (m){
      flushP();
      if (list === 'ol'){ out.push('</ol>'); list = ''; }
      if (list !== 'ul'){ out.push('<ul>'); list = 'ul'; }
      out.push('<li>' + mdInline(m[1]) + '</li>'); i++; continue;
    }

    /* 有序列表 */
    m = /^\s*\d+[.)]\s+(.*)$/.exec(L);
    if (m){
      flushP();
      if (list === 'ul'){ out.push('</ul>'); list = ''; }
      if (list !== 'ol'){ out.push('<ol>'); list = 'ol'; }
      out.push('<li>' + mdInline(m[1]) + '</li>'); i++; continue;
    }

    para.push(L.trim()); i++;
  }
  flushAll();
  return out.join('\n');
}

/* 题型顺序 = **作答难度顺序**（由易到难）：判断 → 单选 → 多选 → 填空 → 简答 → 实操 → 编程。
   ★ 必须与后端 `app/question_types.py::LABELS` 的 dict 顺序一致
     （`tools/check_question_type_order.py` 会校验前后端是否对齐）。 */
const QUESTION_TYPES = [
  {k:'true_false', label:'判断题'}, {k:'single_choice', label:'单选题'},
  {k:'multiple_choice', label:'多选题'}, {k:'fill_blank', label:'填空题'},
  {k:'short_answer', label:'简答题'}, {k:'practical', label:'实操题'},
  {k:'programming', label:'编程题'}
];
function questionTypeKey(p){
  if (QUESTION_TYPES.some(t => t.k === p.question_type)) return p.question_type;
  if (p.line !== 'text') return 'programming';
  const c = p.choices || [];
  return c.length === 2 && c.indexOf('对') >= 0 && c.indexOf('错') >= 0
    ? 'true_false' : (c.length ? 'single_choice' : 'fill_blank');
}
function problemType(p){
  const type = QUESTION_TYPES.find(t => t.k === questionTypeKey(p));
  return type ? type.label : '待分类';
}
function typeClass(p){
  return ({single_choice:'t-mc', multiple_choice:'t-multi', true_false:'t-tf',
    fill_blank:'t-fill', short_answer:'t-short', programming:'t-code',
    practical:'t-practical'})[questionTypeKey(p)] || 't-fill';
}
function stars(n){
  n = Math.max(1, Math.min(5, parseInt(n || 1, 10)));
  let s = '';
  for (let i = 1; i <= 5; i++) s += (i <= n ? '★' : '<span class="off">★</span>');
  return '<span class="stars">' + s + '</span>';
}
function pct(got, max){ return max > 0 ? Math.round(got * 100 / max) : 0; }
/* 一组题的平均难度（分节标题上的「均难」标签） */
function avgDifficulty(list){
  if (!list || !list.length) return 0;
  let s = 0;
  for (const p of list) s += (parseInt(p.difficulty || 1, 10) || 1);
  return s / list.length;
}
function stamp(s){
  const raw = String(s || '');
  if (/(Z|[+-]\d{2}:\d{2})$/.test(raw)) {
    const d = new Date(raw);
    if (!Number.isNaN(d.getTime())) return d.toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
  }
  return raw.replace('T',' ').slice(0,16);
}

/* 离线兜底：把静态题库聚合成和 /api/catalog 一样的结构 */
function buildLocalCatalog(){
  const lp = localProgress();
  const subs = {};
  PROBLEMS.forEach(p => {
    const key = p.subject || 'python';
    const s = subs[key] || (subs[key] = {
      key, label: SUBJECT_LABELS[key] || key, total:0, solved:0, attempted:0, gained:0, max_score:0, sections:{}, lines:{}
    });
    const m = lp[p.id] || {};
    const best = parseInt(m.best_score || 0, 10);
    s.total++;
    s.gained += best;
    s.max_score += parseInt(p.total_score || 0, 10);
    if ((parseInt(m.attempts || 0, 10) || 0) > 0) s.attempted++;
    if (best >= parseInt(p.total_score || 0, 10) && p.total_score > 0) s.solved++;
    const sec = p.source_section || '未分组';
    const g = s.sections[sec] || (s.sections[sec] = { name: sec, total:0, solved:0, gained:0, max_score:0 });
    g.total++;
    g.gained += best;
    g.max_score += parseInt(p.total_score || 0, 10);
    if (best >= parseInt(p.total_score || 0, 10) && p.total_score > 0) g.solved++;
  });
  const list = Object.keys(subs).map(k => {
    const s = subs[k];
    /* 分组顺序：教学路径序号（不是讲次号 —— 见 rankOf 的注释） */
    s.sections = Object.keys(s.sections).map(n => s.sections[n])
      .sort((a,b) => rankOf(k, a.name) - rankOf(k, b.name));
    return s;
  }).sort((a,b) => orderOf(a.key) - orderOf(b.key));
  return { subjects: list,
           user_score: list.reduce((x,s) => x + s.gained, 0),
           user_max_score: list.reduce((x,s) => x + s.max_score, 0) };
}

  });
}
const SUBJECT_ORDER = { python:0, ds:1, cpp:2, linux:3 };
const orderOf = k => (k in SUBJECT_ORDER ? SUBJECT_ORDER[k] : 9);
function lecOf(name){ const m = /第\s*(\d+)\s*讲/.exec(String(name||'')); return m ? parseInt(m[1],10) : 0; }

/* --- 分节教学路径序号 ---------------------------------------------------
   ★ 为什么不直接用 `lecOf()` 排分组：
     没有讲次号的分组（C++ 线的「C++ 编程 · X」、Linux 线的「命令特训 · X」）
     一律返回 0，会被挤到所有讲次**前面**，彼此再按拼音排 —— 学习路径全乱。
   ★ 序号表由后端 `app/section_order.py` 算好：
     在线走 /api/meta 的 section_ranks，离线走 problems.json 的 section_ranks。
     两边是同一份源（app/section_order.py），所以静态站和在线站顺序一致。
*/
let SECTION_RANKS = {};        // { 科目: { 分节名: 序号 } }
function applySectionRanks(map){
  if (!map || typeof map !== 'object') return;
  SECTION_RANKS = map;
}
function rankOf(subject, section){
  const m = SECTION_RANKS[String(subject || 'python')];
  const v = m ? m[String(section || '')] : undefined;
  /* 未登记的分节：垫底，但仍按讲次号排（比纯拼音好） */
  return (v === undefined) ? 100000 + lecOf(section) : v;
}
/* 题目排序键：科目 → 分节教学路径 → 难度 → 录入序 */
function problemOrderKey(p){
  const diff = parseInt(p.difficulty || 1, 10) || 1;
  return [ orderOf(p.subject || 'python'),
           rankOf(p.subject, p.source_section),
           diff,
           parseInt(p.id || 0, 10) ];
}
function cmpProblem(a, b){
  const ka = problemOrderKey(a), kb = problemOrderKey(b);
  for (let i = 0; i < ka.length; i++){
    if (ka[i] !== kb[i]) return ka[i] - kb[i];
  }
  return 0;
}

/* --- 排序方式 ---------------------------------------------------------
   chapter         按章节（默认）：分组显示，组按教学路径、组内由易到难
   difficulty      按难度（易 → 难）：不分章节，全科最容易的排前面
   difficulty_desc 按难度（难 → 易）

   ★ key 必须与后端 `app/api/problems.py::SORT_MODES` 对齐，
     `tools/check_sort_modes.py` 守这条。
   ★ 题号（CP-01 等）始终按**章节序**编好且不随排序方式变 ——
     它得是稳定标识，否则换个排序题号就跳，收藏和记录全对不上。
*/
const SORT_MODES = [
  { k: 'chapter',         label: '按章节' },
  { k: 'difficulty',      label: '难度 易→难' },
  { k: 'difficulty_desc', label: '难度 难→易' },
];
const SORT_KEYS = SORT_MODES.map(m => m.k);
let SORT_MODE = 'chapter';
try { const v = localStorage.getItem(LS.sort); if (SORT_KEYS.indexOf(v) >= 0) SORT_MODE = v; } catch(e){}

function setSortMode(k){
  if (SORT_KEYS.indexOf(k) < 0) return;
  SORT_MODE = k;
  try { localStorage.setItem(LS.sort, k); } catch(e){}
  viewSet(SET.subject);
}

/* 难度序键：科目 → 难度 → 分节教学路径 → 录入序
   （与后端 `_difficulty_key` 同一套规则，同难度回落教学路径） */
function difficultyOrderKey(p, desc){
  const diff = parseInt(p.difficulty || 1, 10) || 1;
  return [ orderOf(p.subject || 'python'),
           desc ? -diff : diff,
           rankOf(p.subject, p.source_section),
           parseInt(p.id || 0, 10) ];
}
function cmpList(a, b){
  const k = (SORT_MODE === 'chapter') ? problemOrderKey(a)
          : difficultyOrderKey(a, SORT_MODE === 'difficulty_desc');
  const k2 = (SORT_MODE === 'chapter') ? problemOrderKey(b)
          : difficultyOrderKey(b, SORT_MODE === 'difficulty_desc');
  for (let i = 0; i < k.length; i++){
    if (k[i] !== k2[i]) return k[i] - k2[i];
  }
  return 0;
}

/* 进度字段统一：在线看 best_score/solved_at，离线看本地标记 */
function bestOf(p){
  if (p.best_score !== undefined && p.best_score !== null) return parseInt(p.best_score || 0, 10);
  const m = localProgress()[p.id] || {};
  return parseInt(m.best_score || 0, 10);
}
function attemptsOf(p){
  if (p.attempts !== undefined && p.attempts !== null) return parseInt(p.attempts || 0, 10);
  const m = localProgress()[p.id] || {};
  return parseInt(m.attempts || 0, 10);
}
function solvedOf(p){
  const t = parseInt(p.total_score || 0, 10);
  return t > 0 && bestOf(p) >= t;
}
function statusOf(p){
  if (solvedOf(p)) return 'solved';
  if (bestOf(p) > 0) return 'partial';
  if (attemptsOf(p) > 0) return 'att';
  return 'none';
}

async function loadCatalog(){
  try { CATALOG = await api('/api/catalog'); OFFLINE = false; }
  catch(e){
    /* 离线兜底是**从题库现聚合**的，所以题库必须先到手 ——
       单独调 loadCatalog 时也补一下，别指望调用方替我们排好顺序 */
    if (!PROBLEMS.length) await loadProblems();
    CATALOG = buildLocalCatalog(); OFFLINE = true;
  }
}

async function loadProblems(){
  try {
    const r = await api('/api/problems?status=published');
    PROBLEMS = r.items || [];
    OFFLINE = false;
  } catch(e){
    /* 静态站兜底：读同目录的 problems.json */
    try {
      const res = await fetch('problems.json', { cache:'no-store' });
      const j = await res.json();
      PROBLEMS = (j.items || []).map(p => Object.assign({}, p, {
        is_choice: !!(p.choices && p.choices.length),
        best_score: undefined, attempts: undefined, solved: undefined,
      }));
      /* 离线：分节教学路径序号也在这份快照里（与在线同一份源） */
      if (j.section_ranks) applySectionRanks(j.section_ranks);
    } catch(e2){ PROBLEMS = []; }
    OFFLINE = true;
  }
  /* ★ 排序：科目 → 分节教学路径 → 难度 → 录入序
     （后端 /api/problems 已经排好，这里再排一次是为了离线兜底时也一致） */
  PROBLEMS.sort(cmpProblem);
  buildSubjSeq();
}

/* 让页面上的进度数字始终是本地的「最新真相」 */
async function refreshAll(){
  await loadProblems();      // 先题库、后目录（离线兜底要拿它聚合）
  await loadCatalog();
  await syncMasteryFromServer();   // 换浏览器/清了缓存时把收藏与备注补回来
  renderNav();
}

   5. 路由
   ========================================================================= */
function parseHash(){
  const h = (location.hash || '#/').replace(/^#/, '');
  const parts = h.split('/').filter(Boolean);
  if (parts[0] === 'set' && parts[1]) return { view:'set', subject: parts[1], lecture:parts[2]==='lecture' ? parts[3] : '', note:parts[4]==='from' ? parts[5] : '' };
  if (parts[0] === 'p'   && parts[1]) return { view:'p', id: parseInt(parts[1],10) };
  if (parts[0] === 'learn') return {view:'learn'};
  if (parts[0] === 'subs') return { view:'subs' };
  if (parts[0] === 'wrongbook') return { view:'wrongbook' };
  if (parts[0] === 'notes'){
    if (!parts[1]) return { view:'notes' };
    /* `#/notes/py-05-05#4.2 切片：[start:stop:step]`
       —— 笔记内部锚点用的是**第二个** `#`，所以不能按 `/` 切完就当 slug 用。
       ★ 锚点里的中文和方括号浏览器会编码，取出来得 decode 才能跟标题 id 对上。 */
    const raw = parts.slice(1).join('/');
    const at = raw.indexOf('#');
    const slug = at < 0 ? raw : raw.slice(0, at);
    let anchor = at < 0 ? '' : raw.slice(at + 1);
    try { anchor = decodeURIComponent(anchor); } catch(e){}
    return { view:'note', slug, anchor };
  }
  return { view:'home' };
}

let routeVersion = 0;
function route(){
  routeVersion++;
  if (POLL) { clearInterval(POLL); POLL = null; }
  SET = parseHash();
  const app = document.getElementById('app');
  app.classList.toggle('wrap', !['p','notes','note'].includes(SET.view));
  app.classList.toggle('problemView', SET.view === 'p');
  app.classList.toggle('notesView', SET.view === 'notes' || SET.view === 'note');
  document.getElementById('navHome').className = SET.view === 'home' ? 'on' : '';
  document.getElementById('navSubs').className = SET.view === 'subs' ? 'on' : '';
  document.getElementById('navWB').className = SET.view === 'wrongbook' ? 'on' : '';
  document.getElementById('navNotes').className =
    (SET.view === 'notes' || SET.view === 'note') ? 'on' : '';
  window.scrollTo(0, 0);
  if (SET.view === 'set')   return viewSet(SET.subject);
  if (SET.view === 'p')     return viewProblem(SET.id);
  if (SET.view === 'learn') return Learning.home();
  if (SET.view === 'subs')  return viewSubmissions();
  if (SET.view === 'wrongbook') return viewWrongbook();
  if (SET.view === 'notes') return viewNotes();
  if (SET.view === 'note')  return viewNote(SET.slug, SET.anchor);
  return viewHome();
}
window.addEventListener('hashchange', route);

function toast(msg, kind){
  const host = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2200);
  setTimeout(() => host.removeChild(el), 2600);
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); toast('已复制', 'ok'); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制', 'ok'); } catch(e2){ toast('复制失败', 'err'); }
    document.body.removeChild(ta);
  }
}

/* =========================================================================
   8. 视图二：题集内（PTA 题集页）
   ========================================================================= */
const FILTERS = [
  { k:'all',   label:'全部' },
  { k:'none',  label:'未做' },
  { k:'todo',  label:'已尝试' },
  { k:'solved',label:'已解决' },
  { k:'full',  label:'满分' },
];
let FILTER = 'all', TYPE_FILTER = 'all', TYPE_SUBJECT = '', QUERY = '', FILTER_CONTEXT = '';
const CLOSED = {};   // 分组折叠状态：只有显式 true 才是收起
let GNAMES = [];     // 当前题集的分组名（onclick 里传下标，避免名字里的引号把内联 JS 打断）

function matchFilter(p){
  const st = statusOf(p);
  if (FILTER === 'none')   return st === 'none';
  if (FILTER === 'todo')   return st === 'att' || st === 'partial';
  if (FILTER === 'solved') return st === 'solved' || st === 'partial';
  if (FILTER === 'full')   return st === 'solved';
  return true;
}
function matchType(p){ return TYPE_FILTER === 'all' || questionTypeKey(p) === TYPE_FILTER; }
function matchQuery(p){
  if (!QUERY) return true;
  const q = QUERY.toLowerCase();
  return String(p.title||'').toLowerCase().indexOf(q) >= 0
      || (p.tags || []).join(' ').toLowerCase().indexOf(q) >= 0
      || String(p.source_section||'').toLowerCase().indexOf(q) >= 0;
}

function viewSet(subject){
  const context = subject + ':' + (SET.lecture || '');
  if (FILTER_CONTEXT !== context){ TYPE_FILTER = 'all'; FILTER = 'all'; QUERY = ''; TYPE_SUBJECT = subject; FILTER_CONTEXT = context; }
  const s = (CATALOG && (CATALOG.subjects || []).find(x => x.key === subject)) || null;
  const all = PROBLEMS.filter(p => (p.subject || 'python') === subject && (!SET.lecture || lecOf(p.source_section) === Number(SET.lecture)));
  try { sessionStorage.setItem('pta.practiceContext',JSON.stringify(SET.lecture ? {subject,lecture:SET.lecture,note:SET.note} : null)); } catch(e){}
  const label = s ? s.label : (SUBJECT_LABELS[subject] || subject);
  const app = document.getElementById('app');

  if (!all.length){
    app.innerHTML = crumb(label) + '<div class="empty">这个题集里还没有题目。</div>';
    return;
  }

  const got = all.reduce((a,p) => a + bestOf(p), 0);
  const max = all.reduce((a,p) => a + parseInt(p.total_score||0,10), 0);
  const solved = all.filter(solvedOf).length;
  const att = all.filter(p => attemptsOf(p) > 0).length;

  /* 分组 + 排序
     ★ chapter：分组显示，组按教学路径序号、组内难度升序（同难度按录入序）
     ★ 难度模式：分组就没意义了（同一难度会横跨所有章节）→ 整科一条列表
  */
  let groups, gnames;
  if (SORT_MODE === 'chapter'){
    groups = {};
    all.forEach(p => {
      const k = p.source_section || '未分组';
      (groups[k] = groups[k] || []).push(p);
    });
    gnames = Object.keys(groups).sort((a,b) => rankOf(subject, a) - rankOf(subject, b));
    Object.keys(groups).forEach(k => groups[k].sort(cmpProblem));
  } else {
    const arrow = (SORT_MODE === 'difficulty') ? '易→难' : '难→易';
    const scope = SET.lecture ? ('第 ' + SET.lecture + ' 讲题目') : '全部题目';
    const name = scope + ' · 难度 ' + arrow;
    groups = {};
    groups[name] = all.slice().sort(cmpList);
    gnames = [name];
  }
  GNAMES = gnames;

  /* 筛选计数 */
  const cnt = { all: all.length, none:0, todo:0, solved:0, full:0 };
  all.forEach(p => {
    const st = statusOf(p);
    if (st === 'none') cnt.none++;
    else if (st === 'att') cnt.todo++;
    else if (st === 'partial') { cnt.todo++; cnt.solved++; }
    else if (st === 'solved') { cnt.solved++; cnt.full++; }
  });

  let html = crumb(label, s ? label : subject);
  if (SET.lecture) html += '<div class="banner modeNotice">第 ' + esc(SET.lecture) + ' 讲配套题 · ' + all.length + ' 题 <a href="#/set/' + esc(subject) + '">查看全部题目</a>' + (SET.note ? ' · <a href="#/notes/' + escAttr(SET.note) + '">返回本讲笔记</a>' : '') + '</div>';
  if (OFFLINE){
    html += '<div class="banner modeNotice"><span class="grow">浏览器判题 · 进度保存在此浏览器</span></div>';
  }

  html += '<div class="setHead">'
    + '<div class="setTitleRow"><span class="setTitle">' + esc(label) + '</span>'
    +   '<span class="pill p-pri">' + all.length + ' 题</span>'
    +   '<span class="pill">' + max + ' 分</span>'
    +   (subject === 'ds' ? '<span class="pill p-ok">C / C++ 任选</span>' : '')
    +   (subject === 'linux' ? '<span class="pill p-ok">选择 · 判断 · 填空</span>' : '')
    + '</div>'
    + '<div class="setStats">'
    +   '<div><b>' + solved + '</b>已解决</div>'
    +   '<div><b>' + att + '</b>已尝试</div>'
    +   '<div><b>' + (all.length - att) + '</b>未开始</div>'
    +   '<div><b>' + got + '</b>已得分</div>'
    + '</div>'
    + '<div class="setBarRow"><div class="bar"><i style="width:' + pct(got,max) + '%"></i></div>'
    +   '<span style="font-size:12.5px;color:var(--muted);white-space:nowrap">' + pct(got,max) + '% 完成</span>'
    + '</div></div>';

  html += '<div class="toolbar">'
    + FILTERS.map(f => '<button class="fbtn' + (FILTER === f.k ? ' on' : '') + '" onclick="setFilter(\'' + f.k + '\')">'
        + f.label + '<span class="n">' + cnt[f.k] + '</span></button>').join('')
    + '<select class="typeSelect" id="typeSelect" aria-label="按题型筛选" onchange="setTypeFilter(this.value)">'
    + '<option value="all">全部题型（' + all.length + '）</option>'
    + QUESTION_TYPES.map(t => { const n = all.filter(p => questionTypeKey(p) === t.k).length;
        return '<option value="' + t.k + '"' + (TYPE_FILTER === t.k ? ' selected' : '')
          + (n ? '' : ' disabled') + '>' + t.label + '（' + n + '）</option>'; }).join('')
    + '</select>'
    + '<select class="typeSelect" id="sortSelect" aria-label="排序方式" title="题目排列方式" onchange="setSortMode(this.value)">'
    + SORT_MODES.map(m => '<option value="' + m.k + '"' + (SORT_MODE === m.k ? ' selected' : '') + '>'
        + m.label + '</option>').join('')
    + '</select>'
    + '<div class="searchBox"><span aria-hidden="true">搜索</span>'
    + '<input id="qbox" placeholder="搜索题目标题 / 标签" value="' + escAttr(QUERY) + '" oninput="onQuery(this.value)"></div>'
    + '<button class="fbtn" onclick="toggleAllGroups()">展开 / 折叠</button>'
    + '</div>';

  let shown = 0;
  gnames.forEach((g, gi) => {
    const items = groups[g].filter(p => matchFilter(p) && matchType(p) && matchQuery(p));
    if (!items.length) return;
    shown += items.length;
    const gGot = groups[g].reduce((a,p) => a + bestOf(p), 0);
    const gMax = groups[g].reduce((a,p) => a + parseInt(p.total_score||0,10), 0);
    const gSolved = groups[g].filter(solvedOf).length;
    const gAvg = avgDifficulty(groups[g]);
    const closed = CLOSED[g] === true;
    html += '<section class="grpbox' + (closed ? ' closed' : '') + '" data-g="' + escAttr(g) + '">'
      + '<div class="grpHead" role="button" tabindex="0" aria-expanded="' + !closed + '" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleGroup(' + gi + ')}" onclick="toggleGroup(' + gi + ')">'
      +   '<span class="tri">▼</span><span class="grpName">' + esc(g) + '</span>'
      +   '<span class="pill" title="本组平均难度 ' + gAvg.toFixed(2) + '">均难 ' + gAvg.toFixed(1) + '</span>'
      +   '<span class="pill' + (gSolved === groups[g].length ? ' p-ok' : '') + '">'
      +     gSolved + ' / ' + groups[g].length + ' 已解决</span>'
      +   '<div class="grow">'
      +     '<div class="bar"><i style="width:' + pct(gGot,gMax) + '%"></i></div>'
      +   '</div>'
      +   '<span class="num">' + gGot + ' / ' + gMax + ' 分</span>'
      + '</div>'
      + '<table class="ptable"><thead><tr>'
      +   '<th>状态</th><th>题号</th><th>题目</th><th>类型</th><th>难度</th><th>标签</th><th style="text-align:right">我的得分</th>'
      + '</tr></thead><tbody>'
      + items.map(rowHtml).join('')
      + '</tbody></table></section>';
  });

  if (!shown) html += '<div class="empty">没有符合当前搜索及筛选条件的题目。<br><button class="btn ghost" style="margin-top:12px" onclick="resetProblemFilters()">清空搜索及筛选</button></div>';
  app.innerHTML = html;
  const qb = document.getElementById('qbox');
  if (qb && QUERY) { qb.focus(); qb.setSelectionRange(qb.value.length, qb.value.length); }
}

function crumb(label, hrefLabel){

  return '<div class="crumb"><a href="#/">题集广场</a><span class="sep">/</span>'

function rowHtml(p){
  const st = statusOf(p);
  const stCls = { solved:'ok', partial:'part', att:'att', none:'none' }[st];
  const stTxt = { solved:'✓', partial:'◐', att:'✕', none:'' }[st];
  const best = bestOf(p), tot = parseInt(p.total_score||0,10);
  const scCls = best >= tot && tot > 0 ? 'scFull' : (best > 0 ? 'scGot' : 'scZero');
  const tags = (p.tags || []).slice(0,3).map(t => '<span class="tag">' + esc(t) + '</span>').join('');
  return '<tr>'
    + '<td class="c-st"><span class="st ' + stCls + '" title="'
      + ({solved:'已解决', partial:'部分正确', att:'尝试过', none:'未做'}[st]) + '">' + stTxt + '</span></td>'
    + '<td class="c-no">' + esc(SUBJ_SEQ[p.id] || p.id) + '</td>'
    + '<td class="c-tt">'
      + '<button type="button" class="wbStarSm' + (isStarred(p) ? ' on' : '') + '"'
      +   ' data-star="' + p.id + '" aria-pressed="' + (isStarred(p) ? 'true' : 'false') + '"'
      +   ' title="' + (isStarred(p) ? '取消收藏' : '收藏') + '">'
      +   (isStarred(p) ? '★' : '☆') + '</button>'
      + '<a href="#/p/' + p.id + '">' + esc(p.title) + '</a></td>'
    + '<td class="c-ty"><span class="tyTag ' + typeClass(p) + '">' + esc(problemType(p)) + '</span></td>'
    + '<td class="c-df">' + stars(p.difficulty) + '</td>'
    + '<td class="c-tg">' + tags + '</td>'
    + '<td class="c-sc"><span class="' + scCls + '">' + best + '</span>'
      + '<span style="color:var(--muted)"> / ' + tot + '</span></td>'
    + '</tr>';
}

function toggleGroup(i){
