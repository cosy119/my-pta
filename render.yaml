# Render 部署蓝图（Blueprint）
#
# 怎么用：
#   1. 打开 https://dashboard.render.com/blueprints
#   2. New Blueprint Instance → 选 GitHub 仓库 cosy119/my-pta
#   3. Render 读这个文件自动建服务；点一下确认即可
#
# ★★ 三个必须知道的现实（2026-10 核实，别照老教程做）★★
#
#   1) **必须用 Docker 运行时**。数据结构线的 C/C++ 题要真编译，
#      而 Render 的原生 python 运行时**不带 gcc/g++** —— 用原生运行时时
#      一提交 C++ 就是 CE。镜像见 Dockerfile（apt 装 gcc g++ libc6-dev）。
#
#   2) **免费实例不能挂持久化 Disk**。Render 官方限制：free plan 无 disk。
#      所以在 free 档上：题库每次启动会从代码重建（没问题），
#      但**做题记录（submissions/mastery）会在休眠、重启、重新部署时全部丢失**。
#      免费实例 15 分钟没人访问就休眠 —— 也就是说进度基本留不住。
#      → 想留进度：把 plan 改成 starter（$7/月），再解开文件末尾的 disk 段。
#
#   3) **免费实例只有 0.1 vCPU / 512 MB**。编译 C++ 会慢，
#      计算量大的题可能比在你本机更早撞上时间限制。
#      个人刷题够用；想舒服点同样上 starter（0.5 vCPU）。
#
services:
  - type: web
    name: my-pta
    runtime: docker                      # ★ 见上面 (1)
    dockerfilePath: ./Dockerfile
    plan: free                           # 想留进度就改 starter
    region: singapore                    # 离国内近；也可 oregon / frankfurt
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PTA_CLOUD
        value: "1"
      # Dockerfile 里已经 mkdir + chown 过 /data 与 /tmp/pta-judge，
      # 没挂卷也能跑（只是重启就没了），挂了卷就是持久化。
      - key: PTA_DB
        value: /data/pta.db
      - key: PTA_LOGS
        value: /data/logs
      - key: PTA_TMP_JUDGE
        value: /tmp/pta-judge
      - key: PYTHONUNBUFFERED
        value: "1"
      # 想收紧跨域（默认 "*"，身份走 X-User-Token，通配也安全）就设它：
      # - key: PTA_ALLOW_ORIGINS
      #   value: https://cosy119.github.io

    # ★★ 持久化 Disk：**只有付费实例（starter 及以上）才能挂**。
    #    免费档留着这段会导致部署报错，所以默认注释掉。
    #    升级到 starter 后把下面四行解开即可（$0.25/GB/月）：
    #
    # disk:
    #   name: pta-data
    #   mountPath: /data
    #   sizeGB: 1
